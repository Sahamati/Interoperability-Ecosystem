    allOf:
    - $ref: "#/definitions/ErrorResponse"
    - $ref: "#/definitions/IOPErrorResponse"
    - {}
    description: At least one of the preconditions you specified did not hold. Set to IopUpstreamError when forwarding an error in the iopError field.
  IOPInternalServerError:
    properties:
      errorCode:
        type: string
        xml:
          attribute: true
        enum:
        - InternalError
        - IopUpstreamError
    allOf:
    - $ref: "#/definitions/ErrorResponse"
    - $ref: "#/definitions/IOPErrorResponse"
    - {}
    description: Encountered an internal error. Please try again. Set to IopUpstreamError when forwarding an error in the iopError field.
  IOPNotImplemented:
    properties:
      errorCode:
        type: string
        xml:
          attribute: true
        enum:
        - NotImplemented
        - IopUpstreamError
    allOf:
    - $ref: "#/definitions/ErrorResponse"
    - $ref: "#/definitions/IOPErrorResponse"
    - {}
    description: Trying to access an unimplemented feature/API. Required when we provide backward compatiable API. Set to IopUpstreamError when forwarding an error in the iopError field.
  IOPServiceUnavailable:
    properties:
      errorCode:
        type: string
        xml:
          attribute: true
        enum:
        - ServiceUnavailable
        - IopUpstreamError
    allOf:
    - $ref: "#/definitions/ErrorResponse"
    - $ref: "#/definitions/IOPErrorResponse"
    - {}
    description: Service is unavailable. Set to IopUpstreamError when forwarding an error in the iopError field.
  IOPBadRequestConsent:
    properties:
      errorCode:
        type: string
        xml:
          attribute: true
        enum:
        - InvalidRequest
        - InvalidURI
        - InvalidSecurity
        - SignatureDoesNotMatch
        - InvalidCustomerAddress
        - InvalidConsentPurpose
        - IopUpstreamError
    allOf:
    - $ref: "#/definitions/IOPBadRequest"
    - {}
    description: Bad Request during Consent Request. Set to IopUpstreamError when forwarding an error in the iopError field.
  IOPBadRequestFIRequest:
    properties:
      errorCode:
        type: string
        xml:
          attribute: true
        enum:
        - InvalidRequest
        - InvalidURI
        - InvalidSecurity
        - SignatureDoesNotMatch
        - InvalidKey
        - InvalidDateRange
        - InvalidConsentId
        - InvalidConsentStatus
        - InvalidConsentDetail
        - InvalidConsentUse
