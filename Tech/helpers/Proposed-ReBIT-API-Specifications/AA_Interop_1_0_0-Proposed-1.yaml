  CustDiscoveryRequest:
    type: object
    required:
    - correlationId
    - customer
    - timestamp
    - txnid
    - ver
    properties:
      ver:
        type: string
        example: 1.0.0
        xml:
          attribute: true
        description: API version.
      timestamp:
        type: string
        format: date-time
        example: 2026-08-18T09:30:00Z
        xml:
          attribute: true
        description: Request creation timestamp.
      txnid:
        type: string
        example: 4a4adbbe-29ae-11e8-a8d7-0289437bf331
        xml:
          attribute: true
        description: Unique transaction identifier used for providing an end to end traceability.
      correlationId:
        $ref: "#/definitions/CorrelationId"
      customer:
        $ref: "#/definitions/CustDiscoveryRequest_customer"
  CustDiscoveryResponse:
    type: object
    required:
    - customerDiscoveryResponse
    - status
    - timestamp
    - txnid
    - correlationId
    - ver
    properties:
      ver:
        type: string
        example: 1.0.0
        xml:
          attribute: true
        description: API version.
      timestamp:
        type: string
        format: date-time
        example: 2026-10-07T07:30:03Z
        xml:
          attribute: true
        description: Creation timestamp of the message.
      txnid:
        type: string
        example: 4a4adbbe-29ae-11e8-a8d7-0289437bf331
        xml:
          attribute: true
        description: Unique transaction identifier used for providing an end to end traceability.
      correlationId:
        $ref: "#/definitions/CorrelationId"
      status:
        type: string
        example: User Found
        xml:
          attribute: true
        description: The status of the user discovery operation. Enumeration value "User Found" or "User Not Found".
        enum:
        - User Found
        - User Not Found
      customerDiscoveryResponse:
        type: array
        description: List of user handles identified.
        items:
          $ref: "#/definitions/CustDiscoveryResponse_customerDiscoveryResponse"
  IOPRequest:
    type: object
    description: |-
      Exactly one of `Initiator` or `Target` MUST be present.
  
