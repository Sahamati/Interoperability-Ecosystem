              example: customer_identifier@AA_identifier
              xml:
                attribute: true
        ConsentHandle:
          type: string
          description: >-
            Unique ID generated by AA after receiving the consent request. Consent Handle can 
            be used by FIU/AA Client to check the consent status and retrieve the consent ID 
            once the consent is approved by customer.
          example: 39e108fe-9243-11e8-b9f2-0256d88baae8
  ConsentHandleResponse:
      type: object
      required:
        - ConsentHandle
        - ConsentStatus
      properties:
        ConsentHandle:
          type: string
          description: >-
            Unique ID generated by AA after receiving the consent request. Consent Handle can 
            be used by FIU/AA Client to check the consent status and retrieve the consent ID 
            once the consent is approved by customer.
          example: 39e108fe-9243-11e8-b9f2-0256d88baae8
          xml:
            attribute: true
        ConsentStatus:
          type: object
          description: Contains the consent artefact related information
          required:
            - status
          properties:
            id:
              type: string
              description: The identifier for the consent artefact.
              example: 12345-67890
            status:
              type: string
              description: Specifies the status of consent artefact.
              xml:
                attribute: true
              enum:
                - APPROVED
                - EXPIRED
                - REJECTED
                - READY
                - FAILED
                - PENDING
  FinancialInformationStatusNotification:
      type: object
      required:
        - Notifier
        - FIStatusNotification
      properties:
        Notifier:
          type: object
          description: Information about the notifier
          required:
            - type
            - id
          properties:
            type:
              type: string
              example: FIP
