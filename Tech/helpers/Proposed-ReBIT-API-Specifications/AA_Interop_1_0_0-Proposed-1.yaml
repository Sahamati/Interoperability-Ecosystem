              description: Unique ID to identify the entity
              xml:
                attribute: true
        FIStatusNotification:
          type: object
          description: Contains the financial information fetch session id and session status details.
          required:
            - sessionId
            - sessionStatus
            - FIStatusResponse
          properties:
            sessionId:
              type: string
              example: XXXX0-XXXX-XXXX
              description: A session ID is a base-64 encoded UUID number that an AA returns to the FIU or AA Client for each financial information access request.
              xml:
                attribute: true
            sessionStatus:
              type: string
              example: ACTIVE
              description: Status of the Financial Information fetch session.
              enum:
                - ACTIVE
                - COMPLETED
                - EXPIRED
                - FAILED
            FIStatusResponse:
              type: array
              description: List of financial information provider responses.
              items:
                type: object
                required:
                  - fipID
                  - Accounts
                properties:
                  fipID:
                    type: string
                    example: FIP-1
                    description: FIP ID as defined in the Account Aggregator Ecosystem
                  Accounts:
                    type: array
                    items:
                      type: object
                      required:
                        - linkRefNumber
                        - FIStatus
                        - description
                      properties:
                        linkRefNumber:
                          type: string
                          example: XXXX-XXXX-XXXX
                          description: Reference number assigned by FIP as part of Account Linking Process.
                        FIStatus:
                          type: string
                          example: READY
                          description: Fetch Status of the Financial Information.
                          xml:
                            attribute: true
                          enum:
                            - READY
                            - DENIED
                            - PENDING
                            - DELIVERED
                            - TIMEOUT
                        description:
                          type: string
                          example: Status details description
                          description: Description associated with the current account fetch status.
