  CustDiscoveryRequest_customer:
    type: object
    properties:
      vuaHash:
        type: string
        example: zcp-JR6K5rSUvaK-IHj5DR2PQi6-xPyVgF_H8FrNIrg
        xml:
          attribute: true
        description: SHA-256 hash of the vua after applying the prescribed canonicalization rules, encoded using Base64URL. Mandatory, if mobileHash is not provided.
      mobileHash:
        type: string
        example: 86R85c49TKitFSJaJFsnWQIveUifXGJxm4yUkPequQ4
        xml:
          attribute: true
        description: SHA-256 hash of the mobile number normalized to E.164 format and encoded using Base64URL. Mandatory, if vuaHash is not provided.
    description: |- 
      Customer identifiers to be searched for. At least one of vuaHash or mobileHash is mandatory.
  CustDiscoveryResponse_customerDiscoveryResponse:
    type: object
    required:
    - customerAddress
    - maskedMobile
    - vuaAttestation
    properties:
      customerAddress:
        type: string
        example: customer@AA
        xml:
          attribute: true
        description: The customer-vua generated during the registration with the AA.
      maskedMobile:
        type: string
        example: XXXXXXXXXX
        xml:
          attribute: true
        description: Customer’s registered mobile number. Used particularly when broadcast discovery is required.
      vuaAttestation:
        type: string
        example: eyJhbGciOiJFUzI1NiIsImtpZCI6InRzLTIwMjYtMTAifQ.eyJpc3MiOi...
        xml:
          attribute: true
        description: Signed attestation (JWS) of the customer's Virtual User Address.
  FITypes:
    type: array
    minItems: 1
    items:
      type: string
      description: List of financial information types.
      example: DEPOSIT
      enum:
        - DEPOSIT
        - TERM_DEPOSIT
        - TERM-DEPOSIT
        - RECURRING_DEPOSIT
        - SIP
        - CP
        - GOVT_SECURITIES
        - EQUITIES
        - BONDS
        - DEBENTURES
        - MUTUAL_FUNDS
        - ETF
        - IDR
        - CIS
        - AIF
        - INSURANCE_POLICIES
        - NPS
        - INVIT
        - REIT
        - GSTR1_3B
        - LIFE_INSURANCE
        - GENERAL_INSURANCE
        - OTHER

  CustomerDiscoverIdentifier:
      type: object
      required:
        - Customer
        - FITypes
      properties:
        Customer:
          type: object
          description: >-
            This block would contain the information about the customer including
            the identifiers & the customer address at the AA
          required:
            - id
            - Identifiers
          properties:
            id:
              type: string
              example: customer_identifier@AA_identifier
              description: Identifier of the Customer generated during the registration with AA.
              xml:
                attribute: true
            Identifiers:
              type: array
              description: >-
                A set of Identifiers required for discovering the accounts of a customer at the FIP. 
                It is mandatory to send atleast one STRONG category Identifier. 
                All identifiers which are used primarily for discovery must be authenticated 
                to ensure that they belong to the user to prevent malicious activity.
              items:
                type: object
                required:
                  - category
                  - type
                  - value
                properties:
                  category:
                    type: string
                    description: >-
                      Category of identifiers based on the ability to find
                      authenticity online.
                    enum:
                      - STRONG
                      - WEAK
                      - ANCILLARY
                    xml:
                      attribute: true
                  type:
                    type: string
                    description: Specifies the type of identifier.
                    example: AADHAAR
                    xml:
                      attribute: true
                    enum:
                      - MOBILE
                      - AADHAR
                      - EMAIL
                      - PAN
                      - DOB
                      - ACCNO
                      - CRN
                      - PPAN
                      - Others
                  value:
                    type: string
                    description: Contains the value/number of selected identifer
                    example: XXXXXXXXXXXXXXXX
                    xml:
                      attribute: true
        FITypes:
          $ref: '#/definitions/FITypes'
  

  DiscoveredAccounts:
      type: object
      description: A list of discovered accounts
      required:
        - Account
      properties:
       Account:
          $ref: '#/definitions/Account'          
 
  Account:
    type: object
    required:
      - FIType
      - accType
      - accRefNumber
      - maskedAccNumber
    properties:
      FIType:
        type: string
        description: Type of Financial Information
        enum:
          - DEPOSIT
          - TERM_DEPOSIT
          - TERM-DEPOSIT
          - RECURRING_DEPOSIT
          - SIP
          - CP
          - GOVT_SECURITIES
          - EQUITIES
          - BONDS
          - DEBENTURES
          - MUTUAL_FUNDS
          - ETF
          - IDR
          - CIS
          - AIF
          - INSURANCE_POLICIES
          - NPS
          - INVIT
          - REIT
          - GSTR1_3B
          - LIFE_INSURANCE
          - GENERAL_INSURANCE
          - OTHER
        xml:
          attribute: true
      accType:
        type: string
        description: The Account Type or Sub FI Type
        enum:
          - SAVINGS
          - CURRENT
          - DEFAULT
          - NRE
          - NRO
          - CENTRAL_GOVT_SECURITIES
          - STATE_GOVT_SECURITIES
          - TREASURY_BILLS
          - SOVEREIGN_GOLD_BONDS
          - FLOATING_RATE_SAVINGS_BONDS
        xml:
          attribute: true
      accRefNumber:
        type: string
        description: >-
          Unique FIP Account Reference Number which is linked with the
          masked account number.
        example: BANK11111111
        xml:
          attribute: true
      maskedAccNumber:
        type: string
        description: Masked account number
        example: XXXXXXX3468
        xml:
          attribute: true
  AccLinkDetailsVerifyResponse:
        type: object
        required:
        - AuthenticatorType
        - RefNumber
        description: Details of the token.
        properties:
              AuthenticatorType:
                type: string
                enum:
                 - DIRECT
                 - TOKEN
                description: |-
                  There are two kinds of authentications that the FIP may support
                  (1) Direct Authentication- The FIP obtains confirmation through a direct interaction with the customer.
                  (2) Token-based Authentication- In this case, a token (e.g., a short-lived one-time password) is issued to the customer, which the customer can then supply to the AA for subsequently forwarding to the FIP.
          
                example: TOKEN
               
              RefNumber:
                type: string
                
                description: Temporary reference number generated by FIP for account linking request
                example: f6b1482e-8f08-11e8-862a-02552b0d3c36
                xml:
                  attribute: true
          
  AccountLinkRequest:
    type: object
    required:
      - Customer
    properties:
      Customer:
        $ref: '#/definitions/Customer'
  TokenDetails:
        type: object
        required:
        - AuthenticatorType
        - RefNumber
        description: Details of the token.
        properties:
              AuthenticatorType:
                type: string
                enum:
                 - DIRECT
                 - TOKEN
                description: |-
                  There are two kinds of authentications that the FIP may support
                  (1) Direct Authentication- The FIP obtains confirmation through a direct interaction with the customer.
                  (2) Token-based Authentication- In this case, a token (e.g., a short-lived one-time password) is issued to the customer, which the customer can then supply to the AA for subsequently forwarding to the FIP.
          
                example: TOKEN
              RefNumber:
                type: string
                
                description: Temporary reference number generated by FIP for account linking request
                example: f6b1482e-8f08-11e8-862a-02552b0d3c36
                xml:
                  attribute: true
 
  Customer:
    type: object
    required:
      - id
      - Accounts
    description: Customer identifiers including AA virtual address.
    properties:
      id:
        type: string
        example: customer_identifier@AA_identifier
        description: Identifier of the Customer generated during the registration with AA.
        xml:
          attribute: true
      Accounts:
        description: 'A list of customer''s accounts to be linked '
        type: array
        items:
          $ref: '#/definitions/Accounts'
  Accounts:
    type: object
    required:
      - FIType
      - accType
      - accRefNumber
      - maskedAccNumber
    properties:
      FIType:
        type: string
        description: Type of Financial Information
        enum:
          - DEPOSIT
          - TERM_DEPOSIT
          - TERM-DEPOSIT
          - RECURRING_DEPOSIT
          - SIP
          - CP
          - GOVT_SECURITIES
          - EQUITIES
          - BONDS
          - DEBENTURES
          - MUTUAL_FUNDS
          - ETF
          - IDR
          - CIS
          - AIF
          - INSURANCE_POLICIES
          - NPS
          - INVIT
          - REIT
          - GSTR1_3B
          - LIFE_INSURANCE
          - GENERAL_INSURANCE
          - OTHER
        xml:
          attribute: true
      accType:
        type: string
        description: The Account Type or Sub FI Type
        enum:
          - SAVINGS
          - CURRENT
          - DEFAULT
          - NRE
          - NRO
          - CENTRAL_GOVT_SECURITIES
          - STATE_GOVT_SECURITIES
          - TREASURY_BILLS
          - SOVEREIGN_GOLD_BONDS
          - FLOATING_RATE_SAVINGS_BONDS
        xml:
          attribute: true
      accRefNumber:
        type: string
        description: >-
          Unique FIP Account Reference Number which is linked with the
          masked account number.
        example: BANK11111111
        xml:
          attribute: true
      maskedAccNumber:
        type: string
        description: Masked account number
        example: XXXXXXX3468
        xml:
          attribute: true  
  AccLinkVerifyDetailsRequest:
    description: >-
      A request of confirmation for account link with a link reference number
      for future identification
    type: object
    required:
      - refNumber
      - token
    properties:
      refNumber:
        type: string
        description: >-
          Temporary reference number generated by FIP for account linking request
        example: f6b1482e-8f08-11e8-862a-02552b0d3c36
        xml:
          attribute: true
      token:
        type: string
        description: >-
          The token that was sent to the customer by the FIP to confirm account link activity
        example: "999999"
        xml:
          attribute: true 
  AccLinkVerifyDetailsResponse:
      type: object
      description: Details for account delink.
      required:
        - AccLinkDetails
      properties:
        AccLinkDetails:
          type: array
          description: Linked account details.
          items:
            type: object
            required:
              - customerAddress
              - linkRefNumber
              - accRefNumber
              - status
            properties:
              customerAddress:
                type: string
                description: Identifier of the Customer generated during the registration with AA.
                example: customer_address@aa_identifier
                xml:
                  attribute: true
              linkRefNumber:
                type: string
                description: Reference number assigned by FIP as part of Account Linking Process.
                example: xxxxxxxxxxxxx
                xml:
                  attribute: true
              accRefNumber:
                type: string
                description: Unique FIP Account Reference Number which is linked with the masked account number.
                example: xxxxxxxxxxxxx
                xml:
                  attribute: true
              status:
                type: string
                description: Status of Account Linking
                example: LINKED
                enum:
                  - LINKED
                  - DELINKED
                xml:
                  attribute: true         
  AccDeLinkRequests:
      type: object
      description: A list of accounts to be de-linked.
      required:
        - Account
      properties: 
        Account:
          type: object
          required:
            - customerAddress
            - linkRefNumber
          properties:
            customerAddress:
              type: string
              description: Identifier of the Customer generated during the registration with AA.
              example: "customer_address@aa_identifier"
              xml:
                attribute: true
            linkRefNumber:
              type: string
              description: Reference number assigned by FIP as part of Account Linking Process.
              example: "xxxxxxxxxxxxx"
              xml:
                attribute: true  
  AccDeLinkResponses:
      type: object
      description: A response of confirmation for account delink.
      required:
        - AccLinkDetails 
      properties:
        AccLinkDetails:
          type: object
          required:
            - customerAddress
            - linkRefNumber
            - status
          properties:
            customerAddress:
              type: string
              description: Identifier of the Customer generated during the registration with AA.
              example: customer_address@aa_identifier
              xml:
                attribute: true
            linkRefNumber:
              type: string
              description: Reference number assigned by FIP as part of Account Linking Process.
              example: "xxxxxxxxxxxxx"
              xml:
                attribute: true
            status:
              type: string
              description: Status of Account Linking
              example: "DELINKED"
              xml:
                attribute: true 
  CustomerConsentHandle:
   type: object
   required: 
    - Customer
    - ConsentHandle
   properties: 
    Customer:
      type: object
      required:
        - id
      description: Contains the customer address
      properties:
        id:
          type: string
          example: customer_identifier@AA_identifier
          description: >-
            The identifier of the Customer generated on registering with an
            AA.
          xml:
            attribute: true
    ConsentHandle:
      type: string
      example: 39e108fe-9243-11e8-b9f2-0256d88baae8
      description: >-
        Unique ID generated by AA after receiving the consent request. 
        Consent Handle can be used by FIU/AA Client to check the consent 
        status and retrieve the consent ID once the consent is approved by customer.
      xml:
        attribute:  true 
  ConsentHandleAA:
   type: object
   description: >-
    Unique ID generated by AA after receiving the consent request. 
    Consent Handle can be used by FIU/AA Client to check the consent status 
    and retrieve the consent ID once the consent is approved by customer. 
   required:
    - ConsentHandle
   properties:
    ConsentHandle:
      type: string
      example: 654024c8-29c8-11e8-8868-0289437bf331
      xml:
        attribute: true 
  consentIdAA:
   type: object
   description: >-
    Unique ID generated by AA after receiving the consent request. 
    Consent Handle can be used by FIU/AA Client to check the consent status 
    and retrieve the consent ID once the consent is approved by customer. 
   required:
    - consentId
   properties:
    consentId:
      type: string
      example: 654024c8-29c8-11e8-8868-0289437bf331
      xml:
        attribute: true 
  consentIdFetch:
   type: object
   description: >-
    Unique ID generated by AA after consent approval is given by the customer.
   required:
    - consentId
   properties:
    consentId:
      type: string
      example: 654024c8-29c8-11e8-8868-0289437bf331
      xml:
        attribute: true 
  ConsentDetail:
        type: object
        description: Specify the financial information types that customer wants to access
        required:
          - consentStart
          - consentExpiry
          - consentMode
          - fetchType
          - consentTypes
          - fiTypes
          - DataConsumer
          - Customer
          - Purpose
          - FIDataRange
          - DataLife
          - Frequency
        properties:
          consentStart:
            type: string
            format: date-time
            example: '2019-12-06T11:39:57.153Z'
            description: >-
              Start date-time of the consent. This field would allow for
              Post-Dated consent.
            xml:
              attribute: true
          consentExpiry:
            type: string
            format: date-time
            example: '2019-12-06T11:39:57.153Z'
            description: Expiry date-time for the consent
            xml:
              attribute: true
          consentMode:
            type: string
            description: Consent Mode as defined in the AA Technical Specification
            enum:
              - VIEW
              - STORE
              - QUERY
              - STREAM
            xml:
              attribute: true
          fetchType:
            type: string
            description: FI Fetch type. Could be ONETIME or PERIODIC
            enum:
              - ONETIME
              - PERIODIC
            xml:
              attribute: true
          consentTypes:
            type: array
            description: Defines the category of financial information which can be fetched using consent
            minItems: 1
            items:
              type: string
              enum:
                - PROFILE
                - SUMMARY
                - TRANSACTIONS
              example: PROFILE
            xml:
              attribute: true
          fiTypes:
            $ref: '#/definitions/FITypes'
          DataConsumer:
            type: object
            required:
              - id
              - type
            description: >-
              The entity which receives data. For a consent
              between FIP & AA, DataConsumer would be AA whereas for a consent
              between FIU/AA Application & AA, DataConsumer would be FIU/AA Client.
            properties:
              id:
                type: string
                example: DC1
                description: DataConsumer ID.
                xml:
                  attribute: true
              type:
                type: string
                description: Type of DataConsumer
                enum:
                  - FIU
                  - USER
                  - AA
                example: FIU
          Customer:
            type: object
            description: Contains the customer address
            properties:
              id:
                type: string
                example: customer_identifier@AA_identifier
                description: >-
                  The identifier of the Customer can be generated during the
                  registration with AA
                xml:
                  attribute: true
              Identifiers:
                type: array
                description: The list of strong identifiers to identify a customer
                items:
                  type: object
                  required:
                    - type
                    - value
                  properties:
                    type:
                      type: string
                      description: The identifier type of given enum values.
                      enum:
                        - MOBILE
                        - EMAIL
                        - OTHERS
                      example: MOBILE
                      xml:
                        attribute: true
                    value:
                      type: string
                      description: verified value of selected identifier
                      example: 919867123456
                      xml:
                        attribute: true
                xml:
                  name: Identifiers
          Purpose:
            $ref: '#/definitions/Purpose'
          FIDataRange:
            type: object
            required:
              - from
              - to
            description: Specifies the date time range for which the financial information is requested
            properties:
              from:
                type: string
                format: date-time
                example: '2023-07-06T11:39:57.153Z'
                description: >-
                  Date-time from which the financial information is requested
                xml:
                  attribute: true
              to:
                type: string
                format: date-time
                example: '2019-12-06T11:39:57.153Z'
                description: >-
                  Date-time till which the financial information is requested
                xml:
                  attribute: true
          DataLife:
            description: Time period for which consumer is allowed to store data.
            type: object
            required:
              - unit
              - value
            properties:
              unit:
                type: string
                description: Unit of time period for which consumer can store the data.
                xml:
                  attribute: true
                enum:
                  - MONTH
                  - YEAR
                  - DAY
                  - INF
              value:
                type: number
                description: >-
                  Define the value of unit of how long can consumer store the data
                xml:
                  attribute: true
          Frequency:
            description: >-
              Defines frequency of FI data fetch within the defined time unit. E.g.HOURLY,DAILY,MONTHLY,YEARLY.
            type: object
            required:
              - unit
              - value
            properties:
              unit:
                type: string
                example: HOUR
                description: >-
                  Defines the time unit of the frequency to access the financial information.
                
                xml:
                  attribute: true
                enum:
                  - HOUR
                  - DAY
                  - MONTH
                  - YEAR
                  - INF
              value:
                type: number
                example: 1
                description: >-
                  Define the number of times FI data can be fetched within the defined time unit.
                xml:
                  attribute: true
          DataFilter:
            type: array
            description: rules that will be utilized by FIP to filter the data
            items:
              type: object
              required:
                - type
                - operator
                - value
              properties:
                type:
                  type: string
                  description: The condition to filter the data on.
                  enum:
                    - TRANSACTIONTYPE
                    - TRANSACTIONAMOUNT
                  example: TRANSACTIONAMOUNT
                  xml:
                    attribute: true
                operator:
                  type: string
                  description: Operator to filter data by.
                  enum:
                    - '='
                    - '!='
                    - '>'
                    - '<'
                    - '>='
                    - '<='
                  example: '>='
                  xml:
                    attribute: true
                value:
                  type: string
                  description: Value based on which data is to be filtered.
                  example: 20000
                  xml:
                    attribute: true
            xml:
              name: DataFilter  
