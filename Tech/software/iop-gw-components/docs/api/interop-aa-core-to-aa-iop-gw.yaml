host: aa-iop-gw.example.internal
basePath: /
schemes:
- https
- http
consumes:
- application/json
produces:
- application/json
securityDefinitions:
  internalApiToken:
    type: apiKey
    in: header
    name: Authorization
    description: '`Bearer <internal API token>`. Required when the aa-iop-gw is configured with an internal API token: the AA''s internal API token (`gwApi.token` in the aa-iop-gw configuration), compared in constant time; otherwise `400 InvalidSecurity`. Without a configured token no `Authorization` is needed: restrict network access to these APIs.'
security:
- internalApiToken: []
tags:
- name: Messages to an FIU (aa-dgw)
  description: '`Target-Entity` type `FIU`. Same payloads as the Direct APIs.'
- name: Messages to a FIP (aa-sgw)
  description: '`Target-Entity` type `FIP`. Same payloads as the Direct APIs.'
- name: Heartbeat
  description: Heartbeat towards a participant that is not directly connected. Sent on as `POST /iop/Heartbeat` (no encrypted payload). A directly connected participant, including the route itself, is checked with the Direct API `GET /Heartbeat`.
- name: Keys
  description: Key push. The aa-core replaces a key set at once, without waiting for the next pull. Exists only for a key type the aa-iop-gw takes from the aa-core (otherwise `404`). The next pull replaces the set again, so the aa-core's key endpoints must return the same set. HTTPS only.
- name: Linked AAs
  description: Linked AAs push. Exists only when the aa-iop-gw takes the list from the aa-core (otherwise `404`). HTTP or HTTPS.
paths:
  /aa-dgw/FI/Notification:
    post:
      tags:
      - Messages to an FIU (aa-dgw)
      summary: FI notification to an FIU (as Customer-AA)
      operationId: post_aa_dgw_FI_Notification
      description: 'Same payload as the Direct API `/FI/Notification`. `Target-Entity` type: `FIU`. Retries and other routes resend the same payload, with the same `txnid`.'
      parameters:
      - $ref: '#/parameters/TargetEntity'
      - $ref: '#/parameters/CorrelationId'
      - $ref: '#/parameters/CoreSignature'
      - $ref: '#/parameters/PreferredHop'
      - $ref: '#/parameters/HttpRetries'
      - $ref: '#/parameters/RouteRetries'
      - $ref: '#/parameters/Body'
      responses:
        '200':
          description: 'The Target''s answer: the payload of the Direct API `/FI/Notification` response, as the Target signed it, with the Target''s status (any `2xx`/`3xx`).'
          headers:
            x-jws-signature:
              type: string
              description: 'When the Target answered with a payload: **the Target''s** detached JWS over the body, taken from the Target''s signed payload. Standard detached JWS (RFC 7515, base64url-encoded payload), not RFC 7797. Already checked by the gateway; to check it again, verify RS256 over `BASE64URL(header) + "." + BASE64URL(body)` with the Target''s signing key from the Central Registry. Never present on an empty body or on a gateway error.'
            Correlation-Id:
              type: string
              description: The value the core sent.
            Forwarding-Hop:
              type: string
              description: The entity id of the Connected-AA / Inter-AA that carried the call. Not present when every route failed.
            IOP-Gw-Error:
              type: string
              description: '`true` only on errors generated by the gateway. Without it, an error came from the Target.'
          schema:
            $ref: '#/definitions/DirectApiResponse'
        '400':
          description: 'Gateway error `InvalidRequest`: `Target-Entity` missing, invalid or of the wrong type; the Target is not registered or not marked interop ready; `Correlation-Id` missing or not a UUID; `Http-Retries` or `Route-Retries` not a non-negative number; the body is not a JSON object with `txnid`; the core''s `x-jws-signature` does not verify; no interop-ready linked AA can reach the Target. Gateway error `InvalidSecurity`: the internal API token is missing or wrong (when one is configured). Gateway error `SignatureDoesNotMatch`: the Target''s signature on the reply does not verify. The Target''s own `400` reaches the core with the same status, without `IOP-Gw-Error`, with the Target''s error payload and signature, or with an empty body. When `IOP-Gw-Error` is absent, the body is not an `ErrorResponse`: it is the Target''s Direct API error payload (`DirectApiResponse`), or empty.'
          headers:
            x-jws-signature:
              type: string
              description: 'Only when the Target answered with a payload: **the Target''s** detached JWS over the body (RFC 7515, base64url-encoded payload), not RFC 7797. Never present on an empty body or on a gateway error.'
            Correlation-Id:
              type: string
              description: The value the core sent.
            IOP-Gw-Error:
              type: string
              description: '`true` when the gateway generated the error.'
            Forwarding-Hop:
              type: string
              description: The entity id of the Connected-AA / Inter-AA that carried the call. Absent when the gateway refused the call before sending it, or when every route failed.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: 'Gateway error `InvalidURI`: The API is not available for the AA.'
          headers:
            Correlation-Id:
              type: string
              description: The value the core sent.
            IOP-Gw-Error:
              type: string
              description: '`true` when the gateway generated the error.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '405':
          description: 'Gateway error `InvalidRequest`: Wrong HTTP method (see `Allow`).'
          headers:
            Correlation-Id:
              type: string
              description: The value the core sent.
            IOP-Gw-Error:
              type: string
              description: '`true` when the gateway generated the error.'
            Allow:
              type: string
              description: The method the API accepts.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '413':
          description: 'Gateway error `InvalidRequest`: The request body is too large.'
          headers:
            Correlation-Id:
              type: string
              description: The value the core sent.
            IOP-Gw-Error:
              type: string
              description: '`true` when the gateway generated the error.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: 'Gateway error `InternalError`: The gateway cannot sign the payload or encrypt it for the Target (for example, no encryption key published for the Target). The Target''s own `500` reaches the core with the same status, without `IOP-Gw-Error`, with the Target''s error payload and signature, or with an empty body. When `IOP-Gw-Error` is absent, the body is not an `ErrorResponse`: it is the Target''s Direct API error payload (`DirectApiResponse`), or empty.'
          headers:
            x-jws-signature:
              type: string
              description: 'Only when the Target answered with a payload: **the Target''s** detached JWS over the body (RFC 7515, base64url-encoded payload), not RFC 7797. Never present on an empty body or on a gateway error.'
            Correlation-Id:
              type: string
              description: The value the core sent.
            IOP-Gw-Error:
              type: string
              description: '`true` when the gateway generated the error.'
            Forwarding-Hop:
              type: string
              description: The entity id of the Connected-AA / Inter-AA that carried the call. Absent when the gateway refused the call before sending it, or when every route failed.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: 'Gateway error `BadGateway`: the AIG is not available, or the answer of the Connected-AA / Inter-AA has an invalid signature, cannot be decrypted or is malformed. The Target''s own `502` reaches the core with the same status, without `IOP-Gw-Error`, with the Target''s error payload and signature, or with an empty body. When `IOP-Gw-Error` is absent, the body is not an `ErrorResponse`: it is the Target''s Direct API error payload (`DirectApiResponse`), or empty.'
          headers:
            x-jws-signature:
              type: string
              description: 'Only when the Target answered with a payload: **the Target''s** detached JWS over the body (RFC 7515, base64url-encoded payload), not RFC 7797. Never present on an empty body or on a gateway error.'
            Correlation-Id:
              type: string
              description: The value the core sent.
            IOP-Gw-Error:
              type: string
              description: '`true` when the gateway generated the error.'
            Forwarding-Hop:
              type: string
              description: The entity id of the Connected-AA / Inter-AA that carried the call. Absent when the gateway refused the call before sending it, or when every route failed.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '503':
          description: 'Gateway error `AllRoutesUnavailable / ServiceUnavailable`: `AllRoutesUnavailable`: every route failed (no Connected-AA / Inter-AA answered, or each answered an error that is not from the Target). `ServiceUnavailable`: the gateway is not ready yet (registry, keys or linkedAAs not loaded, or IopToken unavailable). The Target''s own `503` reaches the core with the same status, without `IOP-Gw-Error`, with the Target''s error payload and signature, or with an empty body. When `IOP-Gw-Error` is absent, the body is not an `ErrorResponse`: it is the Target''s Direct API error payload (`DirectApiResponse`), or empty.'
          headers:
            x-jws-signature:
              type: string
              description: 'Only when the Target answered with a payload: **the Target''s** detached JWS over the body (RFC 7515, base64url-encoded payload), not RFC 7797. Never present on an empty body or on a gateway error.'
            Correlation-Id:
              type: string
              description: The value the core sent.
            IOP-Gw-Error:
              type: string
              description: '`true` when the gateway generated the error.'
            Forwarding-Hop:
              type: string
              description: The entity id of the Connected-AA / Inter-AA that carried the call. Absent when the gateway refused the call before sending it, or when every route failed.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '504':
          description: 'Gateway error `GatewayTimeout`: The core''s request was cancelled while the gateway waited to retry.'
          headers:
            Correlation-Id:
              type: string
              description: The value the core sent.
            IOP-Gw-Error:
              type: string
              description: '`true` when the gateway generated the error.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        default:
          description: 'Any other status from the Target, passed on: the Target''s Direct API error payload with its `x-jws-signature`, or an empty body when the Target answered without a payload (`IopDownstreamError` from the Connected-AA / Inter-AA).'
          headers:
            x-jws-signature:
              type: string
              description: 'When the Target answered with a payload: **the Target''s** detached JWS over the body, taken from the Target''s signed payload. Standard detached JWS (RFC 7515, base64url-encoded payload), not RFC 7797. Already checked by the gateway; to check it again, verify RS256 over `BASE64URL(header) + "." + BASE64URL(body)` with the Target''s signing key from the Central Registry. Never present on an empty body or on a gateway error.'
            Correlation-Id:
              type: string
              description: The value the core sent.
            Forwarding-Hop:
              type: string
              description: The entity id of the Connected-AA / Inter-AA that carried the call. Not present when every route failed.
            IOP-Gw-Error:
              type: string
              description: '`true` only on errors generated by the gateway. Without it, an error came from the Target.'
          schema:
            $ref: '#/definitions/DirectApiResponse'
