swagger: '2.0'
info:
  title: aa-core to aa-iop-gw (internal APIs)
  version: 3.0.0-draft.1
  description: |
    **Disclaimer:** Please review and verify the contents of this document against the applicable system requirements and specifications.

    Kindly note that this document is subject to change as development, integration, and testing progress.

    ---

    # Summary

    The internal APIs that the **aa-iop-gw** offers to the **aa-core**. The aa-core calls them to send a message
    to a participant that is **not directly connected** to the AA. For a directly connected
    participant, the aa-core keeps calling that participant's Direct APIs.

    `/aa-dgw/*` sends to an **FIU** (the aa-core acts as Customer-AA); `/aa-sgw/*` sends to a **FIP** (the aa-core acts as Origin-AA).

    For each message the aa-iop-gw signs the payload with the AA's signing key (inner JWS, RFC 7515),
    encrypts it for the Target, wraps it in an IOP request, chooses a route (Connected-AA / Inter-AA) and sends it on
    `/iop/*`. It then opens the reply and returns the Target's payload, status and signature.

    The request and response bodies are **exactly the payloads of the matching Direct API call** in the
    ReBIT specifications. They are not redefined here: they are shown as `DirectApiRequest` and `DirectApiResponse`.

    Also covered: key push (`/aa-dgw/keys/*` and `/aa-sgw/keys/*`) and linked AAs push (`/aa-dgw/linkedAAs`
    and `/aa-sgw/linkedAAs`).

    Source: IOP Gateway — Integration Guide for the aa-core (`Tech/PRDs/ecosystem/IOP-APIs-Implementation/Sahamati-Reference-Implementation/AA/interop-ecosystem_aa-core-interface-to-iop-gw-prd.md`), sections 3, 5.2 and 6.2. Where this file and the guide differ, the guide applies.

    All identifiers in examples are synthetic.

    # Single-tenant

    The aa-iop-gw serves one AA (AA mode is always single-tenant: `multiTenant: on` is refused at start-up).
    All its settings are in its main configuration file. No entity header is needed: the aa-iop-gw ignores
    `Core-Entity-Id` if sent.

    # Transport

    - HTTPS always; plain HTTP as well when the aa-iop-gw is configured with an HTTP listener. Key push is
      accepted only over HTTPS (`403` on the plain-HTTP listener).
    - `Content-Type` is not required on requests and is not sent on responses.

    # Retries and timeouts

    One call can take up to (1 + `Route-Retries`) × (1 + `Http-Retries`) × (forwarding timeout + 2 s):
    about 4.8 minutes with the defaults. Choose the two headers so that this fits the aa-core's HTTP
    client timeout; for example, with a 60 s timeout send `Http-Retries: 0` and `Route-Retries: 0`.

    # Responses

    | Outcome | Status | Body | `IOP-Gw-Error` |
    |---|---|---|---|
    | The Target answered (success or error) | The Target's status | The Target's Direct API payload, with the Target's `x-jws-signature` | Not set |
    | The Target answered an error without a payload | The Target's status | Empty | Not set |
    | Every route failed | `503` | `ErrorResponse`, `AllRoutesUnavailable` | `true` |
    | The aa-iop-gw refused the call | `400`–`504` | `ErrorResponse` | `true` |

    A status can therefore come from the Target or from the aa-iop-gw: `IOP-Gw-Error: true` tells them apart.
