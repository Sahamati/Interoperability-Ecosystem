            x-jws-signature:
              type: string
              description: 'Only when the Target answered with a payload: **the Target''s** detached JWS over the body (RFC 7515, base64url-encoded payload), not RFC 7797. Never present on an empty body or on a gateway error.'
            Correlation-Id:
              type: string
              description: The value the core sent.
            IOP-Gw-Error:
              type: string
              description: '`true` when the gateway generated the error.'
            Forwarding-Hop:
              type: string
              description: The entity id of the Connected-AA / Inter-AA that carried the call. Absent when the gateway refused the call before sending it, or when every route failed.
