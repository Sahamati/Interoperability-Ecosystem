  /aa-core/FI/fetch:
    post:
      tags:
      - Messages
      summary: FI fetch from an FIU
      operationId: post_aa_core_FI_fetch
      description: 'Same payload as the Direct API `/FI/fetch`. De-duplicate on the payload''s `txnid`: answer a repeat with `409 IdempotencyError`.'
      parameters:
      - $ref: '#/parameters/InitiatorEntity'
      - $ref: '#/parameters/CorrelationId'
