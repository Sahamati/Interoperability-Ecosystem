    post:
      tags:
      - Messages
      summary: Consent fetch from an FIU
      operationId: post_aa_core_Consent_fetch
      description: 'Same payload as the Direct API `/Consent/fetch`. De-duplicate on the payload''s `txnid`: answer a repeat with `409 IdempotencyError`.'
      parameters:
      - $ref: '#/parameters/InitiatorEntity'
      - $ref: '#/parameters/CorrelationId'
      - $ref: '#/parameters/ForwardingHop'
      - $ref: '#/parameters/InitiatorSignature'
      - $ref: '#/parameters/Body'
      responses:
        '200':
          description: Exactly the payload the AA returns in the Direct API `/Consent/fetch` response.
          headers: *id001
          schema:
            $ref: '#/definitions/DirectApiResponse'
        '409':
          description: 'Duplicate: a message with the same payload `txnid` was already received. Not processed again. The error payload of the Direct API, with `errorCode` `IdempotencyError`.'
          headers: *id001
          schema:
            $ref: '#/definitions/DirectApiResponse'
        default:
