    post:
      tags:
      - User discovery
      summary: User discovery from an FIU (the aa-core is the Customer-AA)
      operationId: post_aa_core_User_discover
      description: 'Same payload as the Direct API `/User/discover`. De-duplicate on the payload''s `txnid`: answer a repeat with `409 IdempotencyError`.'
