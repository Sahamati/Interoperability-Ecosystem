swagger: '2.0'
info:
  title: aa-iop-gw to aa-core
  version: 1.0.0-draft.1
  description: |
    **Disclaimer:** Please review and verify the contents of this document against the applicable system requirements and specifications.

    Kindly note that this document is subject to change as development, integration, and testing progress.

    ---

    # Summary

    The APIs that the **aa-core** exposes for the **aa-iop-gw**. The aa-iop-gw calls them to deliver messages
    from participants that are **not directly connected** to the AA, and to pull the
    AA's keys and its list of linked AAs.

    For each IOP call addressed to the AA, the aa-iop-gw checks the calling AA (api-key and
    signature), decrypts the payload, checks the Initiator's signature, and calls the aa-core with the
    plaintext payload. It then signs and encrypts the aa-core's response for the Initiator.

    The request and response bodies are **exactly the payloads of the matching Direct API call** in the
    ReBIT specifications. They are not redefined here: they are shown as `DirectApiRequest` and `DirectApiResponse`.

    Initiators: An FIU (delivered by its Connected-AA): `{"type":"FIU","id":"<FIU id>"}`; a FIP (delivered by its Inter-AA): `{"type":"FIP","id":"<FIP id>"}`.

    Source: IOP Gateway — Integration Guide for the aa-core (iop-gateway-aa-core-prd.md), sections 4, 5.1 and 6.1. Where this file and the guide differ, the guide applies.

    All identifiers in examples are synthetic.

    # Transport

    - Message APIs and linkedAAs: `<aa-core base URL>/aa-core/<api>`, HTTPS or plain HTTP, as set in the
      aa-iop-gw configuration. Expose them only to the aa-iop-gw.
    - Key APIs: **HTTPS only**, at the key base URL set in the aa-iop-gw configuration (it can differ from the
      other endpoints). The aa-iop-gw refuses an `http://` key URL at start-up.
    - The role api-key header of the calling AA and `Content-Type` are not sent to the aa-core.
      `Content-Type` is not required on responses.

    # Rules for the aa-core

    - **De-duplicate on the payload's `txnid`.** Gateways retry and try other routes, so the same
      message can arrive more than once. A repeated `txnid` must not be processed again: answer it
      with `409` and `errorCode` `IdempotencyError` (as in the ReBIT specification).
    - **Return `Correlation-Id` unchanged** on every message response.
    - Respond within the aa-iop-gw's core timeout (30 seconds by default).
    - A status of 300 or above reaches the Initiator as an error. On an error reply (`400` or above) the
      aa-iop-gw adds `errorSource` `{"type":"AA","id":"<the AA's id>"}` to the reply envelope;
      the aa-core does not set it.

    # When the aa-iop-gw cannot use the response

    The Initiator receives instead: `500 InternalError` when the aa-core is unreachable, its response is
    unreadable or too large, has no or a different `Correlation-Id`, or carries an `x-jws-signature` that
    does not verify with the AA's signing keys; `500 InternalError` when the gateway cannot sign
    or encrypt the response.
  x-custom-tags:
    x-generated: '2026-11-13'
    x-caller: aa-iop-gw
    x-callee: aa-core
host: aa-core.example.internal
basePath: /
schemes:
- https
- http
consumes:
- application/json
produces:
- application/json
securityDefinitions:
  coreToken:
    type: apiKey
    in: header
    name: Authorization
    description: '`Bearer <token>`, set in the aa-iop-gw configuration for calls to the core. When it is configured, the aa-core should reject calls without it or with a different value.'
  keyFetchToken:
    type: apiKey
    in: header
    name: Authorization
    description: '`Bearer <key-fetch token>`, set in the aa-iop-gw configuration. The aa-core must reject key requests without it.'
security:
- coreToken: []
tags:
- name: Messages
  description: Messages for the AA. Same payloads as the Direct APIs.
- name: User discovery
  description: Answered from the User Hash List, as for the Direct API `/User/discover`.
- name: Heartbeat
  description: Called when the aa-iop-gw receives `POST /iop/Heartbeat`. No body and no `x-jws-signature`.
- name: Keys
  description: Key pull. Called at start-up, then every hour by default, and every 30 seconds while the aa-iop-gw has no keys of that type. HTTPS only; the only request header is `Authorization` with the key-fetch token. Serve these only to the aa-iop-gw and never log key material.
- name: Linked AAs
  description: Linked AAs pull. Called at start-up, then every hour by default, and every 30 seconds while the aa-iop-gw has no list. The aa-iop-gw keeps the list in memory and in its persistent cache. HTTP or HTTPS.
parameters:
  InitiatorEntity:
    name: Initiator-Entity
    in: header
    required: true
    type: string
    x-example: '{"type":"AA","id":"aa-test-002"}'
    description: 'The Initiator, as compact JSON `{"type":"…","id":"…"}`. An FIU (delivered by its Connected-AA): `{"type":"FIU","id":"<FIU id>"}`; a FIP (delivered by its Inter-AA): `{"type":"FIP","id":"<FIP id>"}`.'
  CorrelationId:
    name: Correlation-Id
    in: header
    required: true
    type: string
    format: uuid
    x-example: 9a1c6e2f-4b7d-4e8a-a3c5-1f0b2d7e6c94
    description: The flow's correlation id, copied unchanged from the IOP message (the gateway never creates one). Return it unchanged.
  ForwardingHop:
    name: Forwarding-Hop
    in: header
    required: true
    type: string
    x-example: aa-test-003
    description: The entity id of the AA that delivered the call.
  InitiatorSignature:
    name: x-jws-signature
    in: header
    required: true
    type: string
    description: 'The Initiator''s detached JWS over the body, taken from the Initiator''s signed payload: a standard detached JWS (RFC 7515, base64url-encoded payload), **not** RFC 7797. Already checked by the gateway; the core may store it as proof of what the Initiator sent. To check it again, verify RS256 over `BASE64URL(header) + "." + BASE64URL(body)` with the Initiator''s signing key from the Central Registry.'
  Body:
    name: body
    in: body
    required: true
    schema:
      $ref: '#/definitions/DirectApiRequest'
    description: 'Exactly the payload the Initiator sent in the matching Direct API call: the exact bytes the Initiator signed.'
paths:
  /aa-core/Consent:
    post:
      tags:
      - Messages
      summary: Consent request from an FIU (the aa-core is the Customer-AA)
      operationId: post_aa_core_Consent
      description: 'Same payload as the Direct API `/Consent`. De-duplicate on the payload''s `txnid`: answer a repeat with `409 IdempotencyError`.'
      parameters:
      - $ref: '#/parameters/InitiatorEntity'
      - $ref: '#/parameters/CorrelationId'
      - $ref: '#/parameters/ForwardingHop'
      - $ref: '#/parameters/InitiatorSignature'
      - $ref: '#/parameters/Body'
      responses:
        '200':
          description: Exactly the payload the AA returns in the Direct API `/Consent` response.
          headers: &id001
            Correlation-Id: &id002
              type: string
              description: Mandatory. The value received in the request, unchanged.
            x-jws-signature:
              type: string
              description: 'Optional. The aa-core''s own detached JWS over the response body: RFC 7797 unencoded payload, protected header `{"alg":"RS256","kid","b64":false,"crit":["b64"]}`, signed over the raw body, with one of the AA''s registered signing keys. If sent and it does not verify, the Initiator receives `500 InternalError`. The gateway signs the response either way.'
          schema:
            $ref: '#/definitions/DirectApiResponse'
        '409':
          description: 'Duplicate: a message with the same payload `txnid` was already received. Not processed again. The error payload of the Direct API, with `errorCode` `IdempotencyError`.'
          headers: *id001
          schema:
            $ref: '#/definitions/DirectApiResponse'
        default:
          description: An error, as the AA returns it in the Direct API `/Consent` call. A status of 300 or above reaches the Initiator as an error.
          headers: *id001
          schema:
            $ref: '#/definitions/DirectApiResponse'
  /aa-core/Consent/handle:
    post:
      tags:
      - Messages
      summary: Consent handle status from an FIU
      operationId: post_aa_core_Consent_handle
      description: 'Same payload as the Direct API `/Consent/handle`. De-duplicate on the payload''s `txnid`: answer a repeat with `409 IdempotencyError`.'
      parameters:
      - $ref: '#/parameters/InitiatorEntity'
      - $ref: '#/parameters/CorrelationId'
      - $ref: '#/parameters/ForwardingHop'
      - $ref: '#/parameters/InitiatorSignature'
      - $ref: '#/parameters/Body'
      responses:
        '200':
          description: Exactly the payload the AA returns in the Direct API `/Consent/handle` response.
          headers: *id001
          schema:
            $ref: '#/definitions/DirectApiResponse'
        '409':
          description: 'Duplicate: a message with the same payload `txnid` was already received. Not processed again. The error payload of the Direct API, with `errorCode` `IdempotencyError`.'
          headers: *id001
          schema:
