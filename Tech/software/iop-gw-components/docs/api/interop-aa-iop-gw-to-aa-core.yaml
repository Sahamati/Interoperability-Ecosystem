      - $ref: '#/parameters/CorrelationId'
      - $ref: '#/parameters/ForwardingHop'
      - $ref: '#/parameters/InitiatorSignature'
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/CustDiscoveryRequest'
        description: The same payload as the Direct API `/User/discover` call.
      responses:
        '200':
          description: Exactly the payload the AA returns in the Direct API `/User/discover` response. `User Found` with one entry per handle found, or `User Not Found` with an empty list; `txnid` and `correlationId` are those of the request.
          headers: *id001
