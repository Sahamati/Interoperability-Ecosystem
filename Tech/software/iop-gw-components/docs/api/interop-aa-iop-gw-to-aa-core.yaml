      operationId: get_aa_core_Heartbeat
      description: Same payload as the Direct API `/Heartbeat`.
      parameters:
      - $ref: '#/parameters/InitiatorEntity'
      - $ref: '#/parameters/CorrelationId'
      - $ref: '#/parameters/ForwardingHop'
      responses:
        '200':
          description: The heartbeat status, as JSON.
          headers:
            Correlation-Id: *id002
          schema:
            $ref: '#/definitions/HeartbeatResponse'
        default:
          description: Any other status reaches the Initiator as an error.
          headers:
            Correlation-Id: *id002
          schema:
            $ref: '#/definitions/ErrorResponse'
      consumes: []
  /aa-core/keys/signing:
    get:
      tags:
      - Keys
      summary: The signing key set
      operationId: get_aa_core_signing_keys
      description: 'The aa-iop-gw reads only the status and the body. The set is accepted only as a whole: if any entry is invalid, or the status is not `200`, the aa-iop-gw keeps its current keys.'
      schemes:
      - https
      security:
      - keyFetchToken: []
      responses:
        '200':
          description: The signing key set.
          schema:
            $ref: '#/definitions/KeySet'
        '401':
          description: The key-fetch token is missing or wrong. The gateway keeps its current keys.
        default:
          description: 'Any status other than `200`: the gateway keeps its current keys.'
  /aa-core/keys/decryption:
    get:
      tags:
      - Keys
      summary: The decryption key set
      operationId: get_aa_core_decryption_keys
      description: 'The aa-iop-gw reads only the status and the body. The set is accepted only as a whole: if any entry is invalid, or the status is not `200`, the aa-iop-gw keeps its current keys.'
      schemes:
      - https
      security:
      - keyFetchToken: []
      responses:
        '200':
          description: The decryption key set.
          schema:
            $ref: '#/definitions/KeySet'
        '401':
          description: The key-fetch token is missing or wrong. The gateway keeps its current keys.
        default:
          description: 'Any status other than `200`: the gateway keeps its current keys.'
  /aa-core/linkedAAs:
    get:
      tags:
      - Linked AAs
      summary: The list of linked AAs
      operationId: get_aa_core_linkedAAs
      description: The only request header is `Authorization` (set in the gateway configuration). No response headers are needed.
      responses:
        '200':
          description: The list of linked AAs.
          schema:
            $ref: '#/definitions/LinkedAAs'
        default:
          description: 'Any status other than `200`: the gateway keeps its current list.'
definitions:
  DirectApiRequest:
    type: object
    description: The existing payload of the matching Direct API request, exactly as defined in the ReBIT specifications, without any change. It must be a JSON object with `txnid`; `ver` is taken from it. Retries and other routes resend the same payload with the same `txnid`, so Targets must de-duplicate on it.
    example: |-
      {
        // existing payload of Direct API.
      }
  DirectApiResponse:
    type: object
    description: The existing payload of the matching Direct API response (success or error), exactly as defined in the ReBIT specifications, without any change.
    example: |-
      {
        // existing payload of Direct API response
      }
  ErrorResponse:
    type: object
    description: 'Error body. Errors generated by the gateway are not signed and carry the `IOP-Gw-Error: true` header.'
    required:
    - ver
    - txnid
    - timestamp
    - errorCode
    - errorMsg
    properties:
      ver:
        type: string
        example: 2.0.0
        description: From the request body; the gateway's configured version if the body has none.
      txnid:
        type: string
        example: 3f2b8c1e-7d4a-4c9e-9b1f-2a6d5e8c4b71
        description: From the request body. For a Heartbeat, the `txnid` the gateway created. Empty for key and linkedAAs calls.
      timestamp:
        type: string
        format: date-time
        example: '2026-11-07T11:33:34.509Z'
      errorCode:
        type: string
        example: InvalidRequest
        enum:
        - InvalidRequest
        - InvalidURI
        - InvalidSecurity
        - SignatureDoesNotMatch
        - InternalError
        - ServiceUnavailable
        - BadGateway
        - GatewayTimeout
        - AllRoutesUnavailable
      errorMsg:
        type: string
        example: Target is not interop ready
        description: Explains the specific cause.
  HeartbeatResponse:
    type: object
    description: The heartbeat status, as in the Direct API `/Heartbeat`.
    properties:
      status:
        type: string
        example: UP
  KeySet:
    type: object
    description: 'A complete key set. It is accepted only as a whole: if any entry is invalid, the gateway keeps its current set.'
    required:
    - keys
    properties:
      keys:
        type: array
        minItems: 1
        items:
          $ref: '#/definitions/KeyEntry'
  KeyEntry:
    type: object
    required:
    - kid
    - privateKey
    - active
    - applied
    properties:
      kid:
        type: string
        example: entity-test-001-sig-2026-10
        description: 'Key id, unique in the set: the kid under which the public key is published in the Central Registry.'
      privateKey:
        type: string
        example: |
          -----BEGIN PRIVATE KEY-----
          <base64 key data>
          -----END PRIVATE KEY-----
        description: PEM, PKCS#8 or PKCS#1, RSA of at least 2048 bits. Never log it.
      active:
        type: boolean
        example: true
        description: '`true` to allow use; `false` to keep the key listed but unused.'
      applied:
        type: string
        example: '2026-10-01T00:00:00Z'
        description: 'From when the key may be used: RFC 3339 timestamp, or `YYYY-MM-DD` (00:00 UTC).'
      expiry:
        type: string
        x-nullable: true
        example: '2026-12-01T00:00:00Z'
        description: Until when the key may be used (same formats), after `applied`; `null` or absent for no expiry.
  LinkedAAs:
    type: object
    description: The AAs the participant is linked to. Must not be empty and must not repeat an id; otherwise the gateway keeps its current list.
    required:
    - linkedAAs
    properties:
      linkedAAs:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
        example:
        - aa-test-002
        - aa-test-003
  CustDiscoveryRequest:
    type: object
    description: As `CustDiscoveryRequest` in the ReBIT specification for `/User/discover`.
    required:
    - ver
    - timestamp
    - txnid
    - correlationId
    - customer
    properties:
      ver:
        type: string
        example: 2.0.0
      timestamp:
        type: string
        format: date-time
        example: '2026-11-07T11:33:34.509Z'
      txnid:
        type: string
        example: 3f2b8c1e-7d4a-4c9e-9b1f-2a6d5e8c4b71
      correlationId:
        type: string
        example: 9a1c6e2f-4b7d-4e8a-a3c5-1f0b2d7e6c94
      customer:
        $ref: '#/definitions/CustDiscoveryRequestCustomer'
  CustDiscoveryRequestCustomer:
    type: object
    description: At least one of `vuaHash` or `mobileHash` is mandatory. Hashing as in the User Discovery Hashing Guide.
    properties:
      vuaHash:
        type: string
        example: synthetic-vua-hash
        description: SHA-256 of the VUA, base64url without padding.
      mobileHash:
        type: string
        example: synthetic-mobile-hash
        description: SHA-256 of the mobile number normalised to `+91` followed by 10 digits, base64url without padding.
  CustDiscoveryResponse:
    type: object
    description: As `CustDiscoveryResponse` in the ReBIT specification for `/User/discover`.
    required:
    - ver
    - timestamp
    - txnid
    - correlationId
    - status
    - customerDiscoveryResponse
    properties:
      ver:
        type: string
        example: 2.0.0
      timestamp:
        type: string
        format: date-time
        example: '2026-11-07T11:33:36.112Z'
      txnid:
        type: string
        example: 3f2b8c1e-7d4a-4c9e-9b1f-2a6d5e8c4b71
      correlationId:
        type: string
        example: 9a1c6e2f-4b7d-4e8a-a3c5-1f0b2d7e6c94
      status:
        type: string
        enum:
        - User Found
        - User Not Found
        example: User Found
      customerDiscoveryResponse:
        type: array
        items:
          $ref: '#/definitions/CustDiscoveryResponseEntry'
  CustDiscoveryResponseEntry:
    type: object
    required:
    - customerAddress
    - maskedMobile
    - vuaAttestation
    properties:
      customerAddress:
        type: string
        example: customer-test-001@aa-test-002
      maskedMobile:
        type: string
        example: XXXXXXXXXX
      vuaAttestation:
        type: string
        example: <VUA attestation>
