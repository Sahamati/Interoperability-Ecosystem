          headers: *id001
          schema:
            $ref: '#/definitions/DirectApiResponse'
  /aa-core/FI/request:
    post:
      tags:
      - Messages
      summary: FI request from an FIU
      operationId: post_aa_core_FI_request
      description: 'Same payload as the Direct API `/FI/request`. De-duplicate on the payload''s `txnid`: answer a repeat with `409 IdempotencyError`.'
      parameters:
      - $ref: '#/parameters/InitiatorEntity'
      - $ref: '#/parameters/CorrelationId'
      - $ref: '#/parameters/ForwardingHop'
