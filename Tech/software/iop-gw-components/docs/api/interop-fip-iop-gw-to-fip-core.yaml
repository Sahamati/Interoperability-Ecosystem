    x-generated: '2026-11-23'
    x-caller: fip-iop-gw
    x-callee: fip-core
host: fip-core.example.internal
basePath: /
schemes:
- https
- http
consumes:
- application/json
produces:
- application/json
securityDefinitions:
  coreToken:
    type: apiKey
    in: header
    name: Authorization
    description: '`Bearer <token>`, set in the fip-iop-gw configuration (in multi-tenant mode, in that FIP''s entity file) as `core.token`, for calls to the core. When it is configured, the fip-core should reject calls without it or with a different value.'
  keyFetchToken:
    type: apiKey
    in: header
    name: Authorization
    description: '`Bearer <key-fetch token>`, set in the fip-iop-gw configuration (in multi-tenant mode, in that FIP''s entity file) as `signingKey.token` and `decryptionKeys.token`. The fip-core must reject key requests without it.'
  linkedAAsToken:
    type: apiKey
    in: header
    name: Authorization
    description: '`Bearer <token>`, set in the fip-iop-gw configuration (in multi-tenant mode, in that FIP''s entity file) as `linkedAAs.token`. The fip-core should reject calls without it or with a different value.'
security:
- coreToken: []
tags:
- name: Messages
  description: Messages for the FIP. Same payloads as the Direct APIs.
- name: Heartbeat
  description: Called when the fip-iop-gw receives `POST /iop/Heartbeat`. No body and no `x-jws-signature`.
- name: Keys
  description: Key pull. Called at start-up, then every hour by default, and every 30 seconds while the fip-iop-gw has no keys of that type. HTTPS only; the only request headers are `Authorization` with the key-fetch token and, in multi-tenant mode, `Core-Entity-Id` (the FIP whose keys are asked for). Serve these only to the fip-iop-gw and never log key material.
- name: Linked AAs
  description: Linked AAs pull. Called at start-up, then every hour by default, and every 30 seconds while the fip-iop-gw has no list. The fip-iop-gw keeps the list in memory and in its persistent cache. HTTP or HTTPS.
parameters:
  CoreEntityId:
    name: Core-Entity-Id
    in: header
    required: false
    type: string
    x-example: fip-test-001
    description: 'Sent only in multi-tenant mode (`multiTenant: on`): the FIP the call is for. In that mode it is always sent, even when only one FIP is loaded on the fip-iop-gw (a fip-core serving one FIP may ignore it). Never sent in single-tenant mode. Not returned on responses.'
  InitiatorEntity:
    name: Initiator-Entity
    in: header
    required: true
    type: string
    x-example: '{"type":"AA","id":"aa-test-002"}'
    description: 'The Initiator, as compact JSON `{"type":"…","id":"…"}`. An Origin-AA (delivered by one of the FIP''s Inter-AAs): `{"type":"AA","id":"<Origin-AA id>"}`.'
  CorrelationId:
    name: Correlation-Id
    in: header
    required: true
    type: string
    format: uuid
    x-example: 9a1c6e2f-4b7d-4e8a-a3c5-1f0b2d7e6c94
    description: The flow's correlation id, copied unchanged from the IOP message (the gateway never creates one). Return it unchanged.
  ForwardingHop:
    name: Forwarding-Hop
    in: header
    required: true
    type: string
    x-example: aa-test-003
    description: The entity id of the AA that delivered the call.
  InitiatorSignature:
    name: x-jws-signature
    in: header
    required: true
    type: string
    description: 'The Initiator''s detached JWS over the body, taken from the Initiator''s signed payload: a standard detached JWS (RFC 7515, base64url-encoded payload), **not** RFC 7797. Already checked by the gateway; the core may store it as proof of what the Initiator sent. To check it again, verify RS256 over `BASE64URL(header) + "." + BASE64URL(body)` with the Initiator''s signing key from the Central Registry.'
  Body:
    name: body
    in: body
    required: true
    schema:
      $ref: '#/definitions/DirectApiRequest'
    description: 'Exactly the payload the Initiator sent in the matching Direct API call: the exact bytes the Initiator signed.'
paths:
  /fip-core/Accounts/discover:
    post:
      tags:
      - Messages
      summary: Account discovery
      operationId: post_fip_core_Accounts_discover
      description: 'Same payload as the Direct API `/Accounts/discover`. De-duplicate on the payload''s `txnid`: answer a repeat with `409 IdempotencyError`.'
      parameters:
      - $ref: '#/parameters/CoreEntityId'
      - $ref: '#/parameters/InitiatorEntity'
      - $ref: '#/parameters/CorrelationId'
      - $ref: '#/parameters/ForwardingHop'
      - $ref: '#/parameters/InitiatorSignature'
      - $ref: '#/parameters/Body'
      responses:
        '200':
          description: Exactly the payload the FIP returns in the Direct API `/Accounts/discover` response.
          headers: &id001
            Correlation-Id: &id002
              type: string
              description: Mandatory. The value received in the request, unchanged.
            x-jws-signature:
              type: string
              description: 'Optional. The fip-core''s own detached JWS over the response body: RFC 7797 unencoded payload, protected header `{"alg":"RS256","kid","b64":false,"crit":["b64"]}`, signed over the raw body, with one of the FIP''s registered signing keys. If sent and it does not verify, the Initiator receives `500 InternalError`. The gateway signs the response either way.'
          schema:
            $ref: '#/definitions/DirectApiResponse'
        '409':
          description: 'Duplicate: a message with the same payload `txnid` was already received. Not processed again. The error payload of the Direct API, with `errorCode` `IdempotencyError`.'
          headers: *id001
          schema:
            $ref: '#/definitions/DirectApiResponse'
        default:
          description: Any other status, as the FIP returns it in the Direct API `/Accounts/discover` call. A status of 400 or above is an error; 2xx and 3xx are passed on as success.
          headers: *id001
          schema:
            $ref: '#/definitions/DirectApiResponse'
