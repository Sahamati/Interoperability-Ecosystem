swagger: '2.0'
info:
  title: fip-iop-gw to fip-core
  version: 3.0.0-draft.1
  description: |
    **Disclaimer:** Please review and verify the contents of this document against the applicable system requirements and specifications.

    Kindly note that this document is subject to change as development, integration, and testing progress.

    ---

    # Summary

    The APIs that the **fip-core** exposes for the **fip-iop-gw**. The fip-iop-gw calls them to deliver messages
    from participants that are **not directly connected** to the FIP, and to pull the
    FIP's keys and its list of linked AAs.

    For each IOP call addressed to the FIP, the fip-iop-gw checks the calling AA (api-key and
    signature), decrypts the payload, checks the Initiator's signature, and calls the fip-core with the
    plaintext payload. It then signs and encrypts the fip-core's response for the Initiator.

    The request and response bodies are **exactly the payloads of the matching Direct API call** in the
    ReBIT specifications. They are not redefined here: they are shown as `DirectApiRequest` and `DirectApiResponse`.

    Initiators: An Origin-AA (delivered by one of the FIP's Inter-AAs): `{"type":"AA","id":"<Origin-AA id>"}`.

    Source: IOP Gateway — Integration Guide for the fip-core (`Tech/PRDs/ecosystem/IOP-APIs-Implementation/Sahamati-Reference-Implementation/FIP/interop-ecosystem_fip-core-interface-to-iop-gw-prd.md`), sections 4, 5.1 and 6.1. Where this file and the guide differ, the guide applies.

    All identifiers in examples are synthetic.

    # Single-tenant and multi-tenant mode

    The fip-iop-gw runs in one of two modes, set with `multiTenant` in its main configuration file.

    | Item | Single-tenant mode (default, `multiTenant: off`) | Multi-tenant mode (`multiTenant: on`) |
    |---|---|---|
    | FIPs per fip-iop-gw | One | One or more |
    | fip-core URLs and tokens | In the main configuration file | In each FIP's entity file |
    | `Core-Entity-Id` to the fip-core | Never sent | Sent on every request |

    **Multi-tenant mode only.** One fip-iop-gw can serve more than one FIP. Each FIP has its own entity
    file on the gateway, with its own fip-core URLs and tokens. Every request to the fip-core (messages,
    Heartbeat, key pull, linkedAAs pull) carries `Core-Entity-Id: <FIP entity id>`: the FIP the call is
    for. It is sent even when only one FIP is loaded; a fip-core serving one FIP may ignore it.
    Responses carry no `Core-Entity-Id`.

    # Transport

    - Message APIs and linkedAAs: `<fip-core base URL>/fip-core/<api>`, HTTPS or plain HTTP, as set in the
      fip-iop-gw configuration (in multi-tenant mode, in that FIP's entity file). Expose them only to the
      fip-iop-gw.
    - Key APIs: **HTTPS only**, at the key base URL set in the fip-iop-gw configuration (in multi-tenant
      mode, in that FIP's entity file); it can differ from the other endpoints. An `http://` key URL is
      refused at start-up in single-tenant mode; in multi-tenant mode it makes that FIP's entity file
      invalid: the FIP is not loaded and the error is logged (the gateway still starts).
    - The role api-key header of the calling AA and `Content-Type` are not sent to the fip-core.
      `Content-Type` is not required on responses.

    # Rules for the fip-core

    - **De-duplicate on the payload's `txnid`.** Gateways retry and try other routes, so the same
      message can arrive more than once. A repeated `txnid` must not be processed again: answer it
      with `409` and `errorCode` `IdempotencyError` (as in the ReBIT specification).
    - **Return `Correlation-Id` unchanged** on every message and Heartbeat response.
    - Respond within the fip-iop-gw's core timeout (30 seconds by default).
    - A status of 400 or above is an error; 2xx and 3xx are passed on as success. On an error reply (`400` or above) the
      fip-iop-gw adds `errorSource` `{"type":"FIP","id":"<the FIP's id>"}` (in multi-tenant mode, the FIP named in `Core-Entity-Id`) to the reply envelope;
      the fip-core does not set it.

    # When the fip-iop-gw cannot use the response

    The Initiator receives instead: `500 InternalError` when the fip-core is unreachable, its response is
    unreadable or too large, has no or a different `Correlation-Id`, or carries an `x-jws-signature` that
    does not verify with the FIP's signing keys; `500 InternalError` when the gateway cannot sign
    or encrypt the response.
