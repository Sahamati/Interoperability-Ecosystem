definitions:
  DirectApiRequest:
    type: object
    description: The existing payload of the matching Direct API request, exactly as defined in the ReBIT specifications, without any change. It must be a JSON object with `txnid`; `ver` is taken from it. Retries and other routes resend the same payload with the same `txnid`, so Targets must de-duplicate on it.
    example: |-
      {
        // existing payload of Direct API.
      }
  DirectApiResponse:
    type: object
    description: The existing payload of the matching Direct API response (success or error), exactly as defined in the ReBIT specifications, without any change.
    example: |-
      {
        // existing payload of Direct API response
      }
  ErrorResponse:
    type: object
    description: 'Error body. Errors generated by the gateway are not signed and carry the `IOP-Gw-Error: true` header.'
    required:
    - ver
    - txnid
    - timestamp
    - errorCode
    - errorMsg
    properties:
      ver:
        type: string
        example: 2.0.0
        description: From the request body; the gateway's configured version if the body has none.
      txnid:
        type: string
        example: 3f2b8c1e-7d4a-4c9e-9b1f-2a6d5e8c4b71
        description: From the request body. For a Heartbeat, the `txnid` the gateway created. Empty for key and linkedAAs calls.
      timestamp:
        type: string
        format: date-time
        example: '2026-11-07T11:33:34.509Z'
      errorCode:
        type: string
        example: InvalidRequest
        enum:
        - InvalidRequest
        - InvalidURI
        - InvalidSecurity
        - SignatureDoesNotMatch
        - InternalError
        - ServiceUnavailable
        - BadGateway
        - GatewayTimeout
        - AllRoutesUnavailable
      errorMsg:
        type: string
        example: Target is not interop ready
        description: Explains the specific cause.
  HeartbeatResponse:
    type: object
    description: The heartbeat status, as in the Direct API `/Heartbeat`.
    properties:
      status:
        type: string
        example: UP
  KeySet:
    type: object
    description: 'A complete key set. It is accepted only as a whole: if any entry is invalid, the gateway keeps its current set.'
    required:
    - keys
    properties:
      keys:
        type: array
        minItems: 1
        items:
          $ref: '#/definitions/KeyEntry'
  KeyEntry:
    type: object
    required:
    - kid
    - privateKey
    - active
    - applied
    properties:
      kid:
        type: string
        example: entity-test-001-sig-2026-10
        description: 'Key id, unique in the set: the kid under which the public key is published in the Central Registry.'
      privateKey:
        type: string
        example: |
          -----BEGIN PRIVATE KEY-----
          <base64 key data>
          -----END PRIVATE KEY-----
        description: PEM, PKCS#8 or PKCS#1, RSA of at least 2048 bits. Never log it.
      active:
        type: boolean
        example: true
        description: '`true` to allow use; `false` to keep the key listed but unused.'
      applied:
        type: string
        example: '2026-10-01T00:00:00Z'
        description: 'From when the key may be used: RFC 3339 timestamp, or `YYYY-MM-DD` (00:00 UTC).'
      expiry:
        type: string
        x-nullable: true
        example: '2026-12-01T00:00:00Z'
        description: Until when the key may be used (same formats), after `applied`; `null` or absent for no expiry.
  LinkedAAs:
    type: object
    description: The AAs the participant is linked to. Must not be empty and must not repeat an id; otherwise the gateway keeps its current list.
    required:
    - linkedAAs
    properties:
      linkedAAs:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
        example:
        - aa-test-002
        - aa-test-003
