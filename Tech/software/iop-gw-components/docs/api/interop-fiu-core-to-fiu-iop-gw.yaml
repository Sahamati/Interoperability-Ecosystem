              description: 'When the Target answered with a payload: **the Target''s** detached JWS over the body, taken from the Target''s signed payload. Standard detached JWS (RFC 7515, base64url-encoded payload), not RFC 7797. Already checked by the gateway; to check it again, verify RS256 over `BASE64URL(header) + "." + BASE64URL(body)` with the Target''s signing key from the Central Registry. Never present on an empty body or on a gateway error.'
            Correlation-Id:
              type: string
              description: The value the core sent.
            Forwarding-Hop:
              type: string
              description: The entity id of the Connected-AA that carried the call. Not present when every route failed.
            IOP-Gw-Error:
              type: string
              description: '`true` only on errors generated by the gateway. Without it, an error came from the Target.'
          schema:
            $ref: '#/definitions/DirectApiResponse'
      consumes: []
  /fiu-dgw/User/discover:
    post:
      tags:
      - User discovery
      summary: User discovery at the customer's AA
      operationId: post_fiu_dgw_User_discover
      description: 'Same payload as the Direct API `/User/discover`. `Target-Entity` type: `AA`. Retries and other routes resend the same payload, with the same `txnid`.'
      parameters:
      - $ref: '#/parameters/TargetEntity'
      - $ref: '#/parameters/CorrelationId'
      - $ref: '#/parameters/CoreSignature'
      - $ref: '#/parameters/PreferredHop'
      - $ref: '#/parameters/HttpRetries'
      - $ref: '#/parameters/RouteRetries'
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/CustDiscoveryRequest'
        description: The same payload as the Direct API `/User/discover` call.
      responses:
        '200':
          description: 'The Target''s answer: the payload of the Direct API `/User/discover` response, as the Target signed it, with the Target''s status (any `2xx`/`3xx`).'
          headers:
            x-jws-signature:
              type: string
              description: 'When the Target answered with a payload: **the Target''s** detached JWS over the body, taken from the Target''s signed payload. Standard detached JWS (RFC 7515, base64url-encoded payload), not RFC 7797. Already checked by the gateway; to check it again, verify RS256 over `BASE64URL(header) + "." + BASE64URL(body)` with the Target''s signing key from the Central Registry. Never present on an empty body or on a gateway error.'
            Correlation-Id:
              type: string
              description: The value the core sent.
            Forwarding-Hop:
              type: string
              description: The entity id of the Connected-AA that carried the call. Not present when every route failed.
            IOP-Gw-Error:
              type: string
              description: '`true` only on errors generated by the gateway. Without it, an error came from the Target.'
          schema:
            $ref: '#/definitions/CustDiscoveryResponse'
        '400':
          description: 'Gateway error `InvalidRequest`: `Target-Entity` missing, invalid or of the wrong type; the Target is not registered or not marked interop ready; `Correlation-Id` missing or not a UUID; `Http-Retries` or `Route-Retries` not a non-negative number; the body is not a JSON object with `txnid`; the core''s `x-jws-signature` does not verify; no interop-ready linked AA can reach the Target. Gateway error `InvalidSecurity`: the internal API token is missing or wrong (when one is configured). Gateway error `SignatureDoesNotMatch`: the Target''s signature on the reply does not verify. The Target''s own `400` reaches the core with the same status, without `IOP-Gw-Error`, with the Target''s error payload and signature, or with an empty body.'
          headers:
            Correlation-Id:
              type: string
              description: The value the core sent.
            IOP-Gw-Error:
              type: string
              description: '`true` when the gateway generated the error.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: 'Gateway error `InvalidURI`: The API is not available for the FIU.'
          headers:
            Correlation-Id:
              type: string
              description: The value the core sent.
            IOP-Gw-Error:
              type: string
              description: '`true` when the gateway generated the error.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '405':
          description: 'Gateway error `InvalidRequest`: Wrong HTTP method (see `Allow`).'
          headers:
            Correlation-Id:
              type: string
              description: The value the core sent.
            IOP-Gw-Error:
              type: string
              description: '`true` when the gateway generated the error.'
            Allow:
              type: string
              description: The method the API accepts.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '413':
          description: 'Gateway error `InvalidRequest`: The request body is too large.'
          headers:
            Correlation-Id:
              type: string
              description: The value the core sent.
            IOP-Gw-Error:
              type: string
              description: '`true` when the gateway generated the error.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: 'Gateway error `InternalError`: The gateway cannot sign the payload or encrypt it for the Target (for example, no encryption key published for the Target). The Target''s own `500` reaches the core with the same status, without `IOP-Gw-Error`, with the Target''s error payload and signature, or with an empty body.'
          headers:
            Correlation-Id:
              type: string
              description: The value the core sent.
            IOP-Gw-Error:
              type: string
              description: '`true` when the gateway generated the error.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: 'Gateway error `BadGateway`: the AIG is not available, or the answer of the Connected-AA has an invalid signature, cannot be decrypted or is malformed. The Target''s own `502` reaches the core with the same status, without `IOP-Gw-Error`, with the Target''s error payload and signature, or with an empty body.'
          headers:
            Correlation-Id:
              type: string
              description: The value the core sent.
            IOP-Gw-Error:
              type: string
              description: '`true` when the gateway generated the error.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '503':
          description: 'Gateway error `AllRoutesUnavailable / ServiceUnavailable`: `AllRoutesUnavailable`: every route failed (no Connected-AA answered, or each answered an error that is not from the Target). `ServiceUnavailable`: the gateway is not ready yet (registry, keys or linkedAAs not loaded, or IopToken unavailable). The Target''s own `503` reaches the core with the same status, without `IOP-Gw-Error`, with the Target''s error payload and signature, or with an empty body.'
          headers:
            Correlation-Id:
              type: string
              description: The value the core sent.
            IOP-Gw-Error:
              type: string
              description: '`true` when the gateway generated the error.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '504':
          description: 'Gateway error `GatewayTimeout`: The core''s request was cancelled while the gateway waited to retry.'
          headers:
            Correlation-Id:
              type: string
              description: The value the core sent.
            IOP-Gw-Error:
              type: string
              description: '`true` when the gateway generated the error.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        default:
          description: 'Any other status from the Target, passed on: the Target''s Direct API error payload with its `x-jws-signature`, or an empty body when the Target answered without a payload (`IopDownstreamError` from the Connected-AA).'
          headers:
            x-jws-signature:
              type: string
              description: 'When the Target answered with a payload: **the Target''s** detached JWS over the body, taken from the Target''s signed payload. Standard detached JWS (RFC 7515, base64url-encoded payload), not RFC 7797. Already checked by the gateway; to check it again, verify RS256 over `BASE64URL(header) + "." + BASE64URL(body)` with the Target''s signing key from the Central Registry. Never present on an empty body or on a gateway error.'
            Correlation-Id:
              type: string
              description: The value the core sent.
            Forwarding-Hop:
              type: string
              description: The entity id of the Connected-AA that carried the call. Not present when every route failed.
            IOP-Gw-Error:
              type: string
              description: '`true` only on errors generated by the gateway. Without it, an error came from the Target.'
          schema:
            $ref: '#/definitions/DirectApiResponse'
  /fiu-dgw/broadcast/User/discover:
    post:
      tags:
      - User discovery
      summary: Ask every AA whether it knows a customer
      operationId: post_fiu_dgw_broadcast_User_discover
      description: |-
        Asks every AA at once and returns one merged answer. The fiu-core does not need to know which AA holds the customer.

        | The AA is | What the fiu-iop-gw sends | The answer is used when |
        |---|---|---|
        | In the FIU's linkedAAs | Direct API `POST <AA base URL>/User/discover`, plaintext, with `client_api_key` and an `x-jws-signature` made with the FIU's signing key | Status `200` and the AA's `x-jws-signature` verifies |
        | Not in linkedAAs, marked interop ready | `/iop/User/discover` through a Connected-AA (routes and retries as for `/fiu-dgw/User/discover`) | The Customer-AA's status is `200` |
        | Not in linkedAAs, not interop ready | Nothing | — |

        - Each AA receives a copy with its own new `txnid` and with `correlationId` set to the `Correlation-Id` header. All other fields are sent as the fiu-core sent them.
        - The fiu-iop-gw waits until every AA has answered, or until `gwApi.broadcastTimeoutSeconds` (default 10 s). Later answers, errors and AAs that do not answer are left out.
        - The fiu-core's HTTP client timeout should be longer than `gwApi.broadcastTimeoutSeconds`.

        `Target-Entity`, `Preferred-Hop` and `x-jws-signature` are not used.
      parameters:
      - $ref: '#/parameters/CorrelationId'
      - name: Http-Retries
        in: header
        required: false
        type: integer
        minimum: 0
        default: 2
        description: As for the other APIs; applies to the `/iop/User/discover` requests sent through a Connected-AA.
      - name: Route-Retries
        in: header
        required: false
        type: integer
        minimum: 0
        default: 2
        description: As for the other APIs; applies to the `/iop/User/discover` requests sent through a Connected-AA.
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/CustDiscoveryRequest'
        description: 'A `CustDiscoveryRequest`: the same payload as the Direct API `/User/discover` call.'
      responses:
        '200':
          description: 'Merged answer. `ver`: from the request body; `timestamp`: time of the response; `txnid`: the fiu-core''s; `correlationId`: the header value; `status`: `User Found` if at least one AA found the customer, otherwise `User Not Found`; `customerDiscoveryResponse`: the entries of every `User Found` answer, merged (empty when none). No `x-jws-signature`, no `Forwarding-Hop`.'
          headers:
            Correlation-Id:
              type: string
              description: The value the fiu-core sent.
          schema:
            $ref: '#/definitions/CustDiscoveryResponse'
        '400':
          description: '`InvalidRequest`: `Correlation-Id` missing or not a UUID; the body is not a JSON object with `txnid`; `Http-Retries` or `Route-Retries` not a non-negative number. `InvalidSecurity`: the internal API token is missing or wrong (when one is configured).'
          headers:
            Correlation-Id:
              type: string
              description: The value the fiu-core sent.
            IOP-Gw-Error:
              type: string
              description: '`true`'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '405':
          description: '`InvalidRequest`: wrong HTTP method (see `Allow`).'
          headers:
            Correlation-Id:
              type: string
              description: The value the fiu-core sent.
            IOP-Gw-Error:
              type: string
              description: '`true`'
            Allow:
              type: string
              description: '`POST`'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '413':
          description: '`InvalidRequest`: the request body is too large.'
          headers:
            Correlation-Id:
              type: string
              description: The value the fiu-core sent.
            IOP-Gw-Error:
              type: string
              description: '`true`'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '503':
          description: '`ServiceUnavailable`: the Central Registry participant list is not loaded yet. `AllRoutesUnavailable`: no AA answered successfully.'
          headers:
            Correlation-Id:
              type: string
              description: The value the fiu-core sent.
            IOP-Gw-Error:
              type: string
              description: '`true`'
          schema:
            $ref: '#/definitions/ErrorResponse'
  /fiu-dgw/keys/signing:
    post:
      tags:
      - Keys
      summary: Replace the signing key set
      operationId: push_fiu_dgw_signing_keys
      description: 'Request headers: only `Authorization`, when an internal API token is configured. Replies, success or error, carry no headers and are not signed.'
      schemes:
      - https
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/KeySet'
      responses:
        '200':
          description: The set is accepted.
          schema:
            $ref: '#/definitions/KeySetStatus'
        '400':
          description: '`InvalidRequest`: the key set is invalid (empty, duplicate or missing `kid`, a key that is not RSA of at least 2048 bits, missing or invalid `active` / `applied` / `expiry`). The current set is kept. `InvalidSecurity`: the internal API token is missing or wrong.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '403':
          description: '`InvalidSecurity`: sent over plain HTTP; key push is accepted only over HTTPS.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: '`InvalidURI`: the gateway does not take this key type from the fiu-core, or the path is not for the FIU.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '405':
          description: '`InvalidRequest`: not `POST`.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '413':
          description: '`InvalidRequest`: the request body is too large.'
          schema:
            $ref: '#/definitions/ErrorResponse'
  /fiu-dgw/keys/decryption:
    post:
      tags:
      - Keys
      summary: Replace the decryption key set
      operationId: push_fiu_dgw_decryption_keys
      description: 'Request headers: only `Authorization`, when an internal API token is configured. Replies, success or error, carry no headers and are not signed.'
      schemes:
      - https
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/KeySet'
      responses:
        '200':
          description: The set is accepted.
          schema:
            $ref: '#/definitions/KeySetStatus'
        '400':
          description: '`InvalidRequest`: the key set is invalid (empty, duplicate or missing `kid`, a key that is not RSA of at least 2048 bits, missing or invalid `active` / `applied` / `expiry`). The current set is kept. `InvalidSecurity`: the internal API token is missing or wrong.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '403':
          description: '`InvalidSecurity`: sent over plain HTTP; key push is accepted only over HTTPS.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: '`InvalidURI`: the gateway does not take this key type from the fiu-core, or the path is not for the FIU.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '405':
          description: '`InvalidRequest`: not `POST`.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '413':
          description: '`InvalidRequest`: the request body is too large.'
          schema:
            $ref: '#/definitions/ErrorResponse'
  /fiu-dgw/linkedAAs:
    post:
      tags:
      - Linked AAs
      summary: Replace the list of linked AAs
      operationId: push_fiu_dgw_linkedAAs
      description: 'Request headers: only `Authorization`, when an internal API token is configured. Replies, success or error, carry no headers.'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/LinkedAAs'
      responses:
        '200':
          description: The new list.
          schema:
            $ref: '#/definitions/LinkedAAs'
        '400':
          description: '`InvalidRequest`: empty list or repeated id. The current list is kept. `InvalidSecurity`: the internal API token is missing or wrong.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: The gateway does not take the list from the fiu-core.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '405':
          description: Not `POST`.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '413':
          description: The request body is too large.
          schema:
            $ref: '#/definitions/ErrorResponse'
parameters:
  TargetEntity:
    name: Target-Entity
    in: header
    required: true
    type: string
    x-example: '{"type":"AA","id":"aa-test-002"}'
    description: The final recipient, as compact JSON `{"type":"<AA|FIU|FIP>","id":"<entity id>"}`. The type must match the API. The Target must be registered and marked interop ready in the Central Registry.
  CorrelationId:
    name: Correlation-Id
    in: header
    required: true
    type: string
    format: uuid
    x-example: 9a1c6e2f-4b7d-4e8a-a3c5-1f0b2d7e6c94
    description: 'The flow''s correlation id, standard UUID format (RFC 4122). Created by the Initiator, kept on every message of the flow, never created by the gateway. Missing or not a UUID: `400 InvalidRequest`.'
  CoreSignature:
    name: x-jws-signature
    in: header
    required: false
    type: string
    description: 'Optional. The fiu-core''s own detached JWS over the request body: RFC 7797 unencoded payload, protected header `{"alg":"RS256","kid","b64":false,"crit":["b64"]}`, signed over the raw body, with one of the FIU''s registered signing keys. Checked by the gateway: `400` if it does not verify. The gateway signs the payload either way.'
  PreferredHop:
    name: Preferred-Hop
    in: header
    required: false
    type: string
    x-example: aa-test-003
    description: Entity id of the AA the core prefers as the route. Used first only if it is an eligible route; otherwise ignored.
  HttpRetries:
    name: Http-Retries
    in: header
    required: false
    type: integer
    minimum: 0
    default: 2
    description: 'How many times to retry the same route when it does not answer (no connection, or a timeout). An error answer, `502`/`503`/`504` included, is not retried on that route. `0`: do not retry. Capped by the gateway (by default at 3). Waits 200 ms, doubling up to 2 s.'
  RouteRetries:
    name: Route-Retries
    in: header
    required: false
    type: integer
    minimum: 0
    default: 2
    description: 'How many other routes to try after the first route fails. `0`: do not try another route. Capped by the gateway (by default at 2).'
  Body:
    name: body
    in: body
    required: true
    schema:
      $ref: '#/definitions/DirectApiRequest'
    description: Exactly the payload of the matching Direct API call. Must be a JSON object with `txnid`.
definitions:
  DirectApiRequest:
    type: object
    description: The existing payload of the matching Direct API request, exactly as defined in the ReBIT specifications, without any change. It must be a JSON object with `txnid`; `ver` is taken from it. Retries and other routes resend the same payload with the same `txnid`, so Targets must de-duplicate on it.
    example: |-
      {
        // existing payload of Direct API.
      }
  DirectApiResponse:
    type: object
    description: The existing payload of the matching Direct API response (success or error), exactly as defined in the ReBIT specifications, without any change.
    example: |-
      {
        // existing payload of Direct API response
      }
  ErrorResponse:
    type: object
    description: 'Error body. Errors generated by the gateway are not signed and carry the `IOP-Gw-Error: true` header.'
    required:
    - ver
    - txnid
    - timestamp
    - errorCode
    - errorMsg
    properties:
      ver:
        type: string
        example: 2.0.0
        description: From the request body; the gateway's configured version if the body has none.
      txnid:
        type: string
        example: 3f2b8c1e-7d4a-4c9e-9b1f-2a6d5e8c4b71
        description: From the request body. For a Heartbeat, the `txnid` the gateway created. Empty for key and linkedAAs calls.
      timestamp:
        type: string
        format: date-time
        example: '2026-11-07T11:33:34.509Z'
      errorCode:
        type: string
        example: InvalidRequest
        enum:
        - InvalidRequest
        - InvalidURI
        - InvalidSecurity
        - SignatureDoesNotMatch
        - InternalError
        - ServiceUnavailable
        - BadGateway
        - GatewayTimeout
        - AllRoutesUnavailable
      errorMsg:
        type: string
        example: Target is not interop ready
        description: Explains the specific cause.
  KeySet:
    type: object
    description: 'A complete key set. It is accepted only as a whole: if any entry is invalid, the gateway keeps its current set.'
    required:
    - keys
    properties:
      keys:
        type: array
        minItems: 1
        items:
          $ref: '#/definitions/KeyEntry'
  KeyEntry:
    type: object
    required:
    - kid
    - privateKey
    - active
    - applied
    properties:
      kid:
        type: string
        example: entity-test-001-sig-2026-10
        description: 'Key id, unique in the set: the kid under which the public key is published in the Central Registry.'
      privateKey:
        type: string
        example: |
          -----BEGIN PRIVATE KEY-----
          <base64 key data>
          -----END PRIVATE KEY-----
        description: PEM, PKCS#8 or PKCS#1, RSA of at least 2048 bits. Never log it.
      active:
        type: boolean
        example: true
        description: '`true` to allow use; `false` to keep the key listed but unused.'
      applied:
        type: string
        example: '2026-10-01T00:00:00Z'
        description: 'From when the key may be used: RFC 3339 timestamp, or `YYYY-MM-DD` (00:00 UTC).'
      expiry:
        type: string
        x-nullable: true
        example: '2026-12-01T00:00:00Z'
        description: Until when the key may be used (same formats), after `applied`; `null` or absent for no expiry.
  KeySetStatus:
    type: object
    description: The accepted set. Each entry repeats the key's validity and adds `usable`. No key material is returned.
    properties:
      keys:
        type: array
        items:
          $ref: '#/definitions/KeyStatus'
  KeyStatus:
    type: object
    properties:
      kid:
        type: string
        example: entity-test-001-sig-2026-10
      active:
        type: boolean
        example: true
      applied:
        type: string
        example: '2026-10-01T00:00:00Z'
      expiry:
        type: string
        x-nullable: true
        example: '2026-12-01T00:00:00Z'
      usable:
        type: boolean
        example: true
        description: Whether the key can be used now.
  LinkedAAs:
    type: object
    description: The AAs the participant is linked to. Must not be empty and must not repeat an id; otherwise the gateway keeps its current list.
    required:
    - linkedAAs
    properties:
      linkedAAs:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
        example:
        - aa-test-002
        - aa-test-003
  CustDiscoveryRequest:
    type: object
    description: As `CustDiscoveryRequest` in the ReBIT specification for `/User/discover`.
    required:
    - ver
    - timestamp
    - txnid
    - correlationId
    - customer
    properties:
      ver:
        type: string
        example: 2.0.0
      timestamp:
        type: string
        format: date-time
        example: '2026-11-07T11:33:34.509Z'
      txnid:
        type: string
        example: 3f2b8c1e-7d4a-4c9e-9b1f-2a6d5e8c4b71
      correlationId:
        type: string
        example: 9a1c6e2f-4b7d-4e8a-a3c5-1f0b2d7e6c94
      customer:
        $ref: '#/definitions/CustDiscoveryRequestCustomer'
  CustDiscoveryRequestCustomer:
    type: object
    description: At least one of `vuaHash` or `mobileHash` is mandatory. Hashing as in the User Discovery Hashing Guide.
    properties:
      vuaHash:
        type: string
        example: synthetic-vua-hash
        description: SHA-256 of the VUA, base64url without padding.
      mobileHash:
        type: string
        example: synthetic-mobile-hash
        description: SHA-256 of the mobile number normalised to `+91` followed by 10 digits, base64url without padding.
  CustDiscoveryResponse:
    type: object
    description: As `CustDiscoveryResponse` in the ReBIT specification for `/User/discover`.
    required:
    - ver
    - timestamp
    - txnid
    - correlationId
    - status
    - customerDiscoveryResponse
    properties:
      ver:
        type: string
        example: 2.0.0
      timestamp:
        type: string
        format: date-time
        example: '2026-11-07T11:33:36.112Z'
      txnid:
        type: string
        example: 3f2b8c1e-7d4a-4c9e-9b1f-2a6d5e8c4b71
      correlationId:
        type: string
        example: 9a1c6e2f-4b7d-4e8a-a3c5-1f0b2d7e6c94
      status:
        type: string
        enum:
        - User Found
        - User Not Found
        example: User Found
      customerDiscoveryResponse:
        type: array
        items:
          $ref: '#/definitions/CustDiscoveryResponseEntry'
  CustDiscoveryResponseEntry:
    type: object
    required:
    - customerAddress
    - maskedMobile
    - vuaAttestation
    properties:
      customerAddress:
        type: string
        example: customer-test-001@aa-test-002
      maskedMobile:
        type: string
        example: XXXXXXXXXX
      vuaAttestation:
        type: string
        example: <VUA attestation>
