swagger: '2.0'
info:
  title: fiu-core to fiu-iop-gw (internal APIs)
  version: 1.0.0-draft.1
  description: |
    **Disclaimer:** Please review and verify the contents of this document against the applicable system requirements and specifications.

    Kindly note that this document is subject to change as development, integration, and testing progress.

    ---

    # Summary

    The internal APIs that the **fiu-iop-gw** offers to the **fiu-core**. The fiu-core calls them to send a message
    to a participant that is **not directly connected** to the FIU. For a directly connected
    participant, the fiu-core keeps calling that participant's Direct APIs.

    `/fiu-dgw/*` sends to the **customer's AA** (the Customer-AA).

    For each message the fiu-iop-gw signs the payload with the FIU's signing key (inner JWS, RFC 7515),
    encrypts it for the Target, wraps it in an IOP request, chooses a route (Connected-AA) and sends it on
    `/iop/*`. It then opens the reply and returns the Target's payload, status and signature.

    The request and response bodies are **exactly the payloads of the matching Direct API call** in the
    ReBIT specifications. They are not redefined here: they are shown as `DirectApiRequest` and `DirectApiResponse`.

    Also covered: key push (`/fiu-dgw/keys/*`) and linked AAs push (`/fiu-dgw/linkedAAs`).

    Source: IOP Gateway — Integration Guide for the fiu-core (iop-gateway-fiu-core-prd.md), sections 3, 5.2 and 6.2. Where this file and the guide differ, the guide applies.

    All identifiers in examples are synthetic.

    # Transport

    - HTTPS always; plain HTTP as well when the fiu-iop-gw is configured with an HTTP listener. Key push is
      accepted only over HTTPS (`403` on the plain-HTTP listener).
    - `Content-Type` is not required on requests and is not sent on responses.

    # Retries and timeouts

    One call can take up to (1 + `Route-Retries`) × (1 + `Http-Retries`) × (forwarding timeout + 2 s):
    about 4.8 minutes with the defaults. Choose the two headers so that this fits the fiu-core's HTTP
    client timeout; for example, with a 60 s timeout send `Http-Retries: 0` and `Route-Retries: 0`.

    # Responses

    | Outcome | Status | Body | `IOP-Gw-Error` |
    |---|---|---|---|
    | The Target answered (success or error) | The Target's status | The Target's Direct API payload, with the Target's `x-jws-signature` | Not set |
    | The Target answered an error without a payload | The Target's status | Empty | Not set |
    | Every route failed | `503` | `ErrorResponse`, `AllRoutesUnavailable` | `true` |
    | The fiu-iop-gw refused the call | `400`–`504` | `ErrorResponse` | `true` |

    A status can therefore come from the Target or from the fiu-iop-gw: `IOP-Gw-Error: true` tells them apart.
