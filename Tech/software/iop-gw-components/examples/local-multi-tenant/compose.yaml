# Multi-tenant example: one IOP Gateway in FIU mode serving two FIUs (fiu-test-001 and
# fiu-test-005, multiTenant: on), two single-tenant AA gateways, iop-gw-mocks (token
# service, Central Registry, AIG) and stand-in cores. Testing only.
#
#   ./setup.sh                 # synthetic keys, credentials, .env
#   docker compose up -d --wait
#   ./smoke.sh                 # both FIUs, both directions
#   docker compose down -v
#
# IOPGW_IMAGE and IOPGW_MOCKS_IMAGE choose the images (default iop-gw:0.1.0.0 and
# iop-gw-mocks:0.1.0.0).

x-gateway: &gateway
  image: ${IOPGW_IMAGE:-iop-gw:0.1.0.0}
  env_file: .env
  environment:
    # The image's JVM options, plus trust for the mocks' self-signed certificate.
    JAVA_TOOL_OPTIONS: >-
      -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -XX:-HeapDumpOnOutOfMemoryError
      -Djavax.net.ssl.trustStore=/mocks-out/truststore.p12
      -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12
  depends_on:
    mocks: {condition: service_healthy}
  tmpfs: [/tmp]
  read_only: true
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8080/healthz"]
    interval: 3s
    timeout: 3s
    retries: 40

x-core: &core
  image: python:3.13-alpine
  command: ["python", "/core-stub.py"]
  volumes: ["./core-stub.py:/core-stub.py:ro"]

services:
  mocks:
    image: ${IOPGW_MOCKS_IMAGE:-iop-gw-mocks:0.1.0.0}
    volumes:
      - ./mocks.yaml:/etc/iop-gw-mocks/mocks.yaml:ro
      - ./generated:/etc/iop-gw-mocks/generated:ro
      - mocks-out:/var/lib/iop-gw-mocks/out
    tmpfs: [/tmp]
    read_only: true
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:9443/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  core-fiu-test-001: {<<: *core, environment: {CORE_NAME: core-fiu-test-001}}
  core-fiu-test-005: {<<: *core, environment: {CORE_NAME: core-fiu-test-005}}
  core-aa-test-004: {<<: *core, environment: {CORE_NAME: core-aa-test-004}}

  gw-fiu:
    <<: *gateway
    volumes:
      - ./gateways/fiu.yaml:/etc/iop-gw/config.yaml:ro
      - ./gateways/entities:/etc/iop-gw/entities:ro    # one file per FIU, read again every 10 s
      - ./generated:/etc/iop-gw/generated:ro
      - mocks-out:/mocks-out:ro
      - cache-fiu:/var/lib/iop-gw/cache
    ports: ["127.0.0.1:18181:8081"]   # the FIUs' internal API, for smoke.sh

  gw-aa-test-002:
    <<: *gateway
    volumes:
      - ./gateways/aa-test-002.yaml:/etc/iop-gw/config.yaml:ro
      - ./generated:/etc/iop-gw/generated:ro
      - mocks-out:/mocks-out:ro
      - cache-aa-test-002:/var/lib/iop-gw/cache

  gw-aa-test-004:
    <<: *gateway
    volumes:
      - ./gateways/aa-test-004.yaml:/etc/iop-gw/config.yaml:ro
      - ./generated:/etc/iop-gw/generated:ro
      - mocks-out:/mocks-out:ro
      - cache-aa-test-004:/var/lib/iop-gw/cache
    ports: ["127.0.0.1:18184:8081"]   # aa-test-004's internal API, for smoke.sh

volumes:
  mocks-out:
  cache-fiu:
  cache-aa-test-002:
  cache-aa-test-004:
