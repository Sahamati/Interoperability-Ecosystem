# IOP Gateway for aa-test-002 (AA mode): production sources, pointed at iop-gw-mocks.
# Against Sahamati, change only the four https://mocks:9443 URLs (and drop the
# truststore option in compose.yaml).
mode: AA
logging: {level: INFO, audit: true, statsIntervalSeconds: 60}
listenAddr: "0.0.0.0:8080"
self:
  id: aa-test-002
  signingKey: {source: file, kid: aa-test-002-sig, file: /etc/iop-gw/generated/aa-test-002/sig.pem}
  decryptionKeys: {source: file, keys: [{kid: aa-test-002-enc, file: /etc/iop-gw/generated/aa-test-002/enc.pem}]}
core: {baseUrl: "http://core-aa-test-002:8090", timeoutSeconds: 10}
tokenService:
  baseUrl: "https://mocks:9443"
  credentialsFile: /etc/iop-gw/generated/aa-test-002/credentials.json
apiKey:
  mode: jwt
  issuerKeysUrl: "https://mocks:9443/tokenservice/jwks"
  issuer: "https://mock-token-service.local/realms/sahamati"
jws: {algorithm: RS256}
cr: {source: api, baseUrl: "https://mocks:9443"}
aigSource: api
aigBaseUrl: "https://mocks:9443"
gwApi:
  listenAddr: "0.0.0.0:8443"
  httpListenAddr: "0.0.0.0:8081"
  tls: {certFile: /etc/iop-gw/generated/gw-tls.crt, keyFile: /etc/iop-gw/generated/gw-tls.key}
  token: "${IOPGW_API_TOKEN}"
linkedAAs: {source: config, aas: [aa-test-004]}
forwarding: {timeoutSeconds: 10}
cache: {dir: /var/lib/iop-gw/cache}
