apiVersion: v1
kind: Service
metadata:
  name: {{ include "iop-gw-mocks.fullname" . }}
  labels: {{- include "iop-gw-mocks.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "iop-gw-mocks.selector" . | nindent 4 }}
  ports:
    - {name: https, port: {{ .Values.service.port }}, targetPort: https}
