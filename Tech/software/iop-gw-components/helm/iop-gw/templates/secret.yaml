{{- if .Values.createSecrets.enabled }}
# Testing only: Secrets created from values. Use existingSecret in real deployments.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "iop-gw.fullname" . }}-env
  labels: {{- include "iop-gw.labels" . | nindent 4 }}
type: Opaque
stringData: {{- toYaml .Values.createSecrets.env | nindent 2 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "iop-gw.fullname" . }}-files
  labels: {{- include "iop-gw.labels" . | nindent 4 }}
type: Opaque
stringData: {{- toYaml .Values.createSecrets.files | nindent 2 }}
{{- end }}
