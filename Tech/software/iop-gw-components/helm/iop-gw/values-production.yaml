# Production values for the IOP Gateway chart: copy this file, replace every
# REPLACE-ME, and install with:
#   helm install <release> ./iop-gw -f my-values.yaml
#
# Before installing, create the two Secrets the gateway reads (names below):
#   kubectl create secret generic iop-gw-env --from-literal=IOPGW_API_TOKEN=<random token>
#   kubectl create secret generic iop-gw-files \
#     --from-file=signing.pem=<your signing private key> \
#     --from-file=decryption.pem=<your decryption private key> \
#     --from-file=credentials.json=<your token-service credentials file> \
#     --from-file=gw-tls.crt=<internal API certificate> --from-file=gw-tls.key=<its key>
# (or let Vault / your cloud secret store create them with these keys).

image:
  repository: REPLACE-ME/iop-gw
  tag: "0.0.0.0"

replicaCount: 1

secretEnv: {existingSecret: iop-gw-env}
files: {existingSecret: iop-gw-files}

# RocksDB cache on a persistent volume: a restarted gateway serves at once from
# its cache, even while a Sahamati service is briefly unreachable.
cache:
  persistent: true
  size: 1Gi
  storageClassName: ""          # your cluster's default when empty

# Internal APIs over HTTPS only.
ports: {gwApiHttp: 0}

resources:
  requests: {cpu: 500m, memory: 768Mi}
  limits: {memory: 1536Mi}

config:
  mode: AA                       # AA, FIU or FIP
  logging: {level: INFO, audit: true, statsIntervalSeconds: 60}
  self:
    id: REPLACE-ME-entity-id     # your Central Registry id
    signingKey: {source: file, kid: REPLACE-ME-signing-kid, file: /etc/iop-gw/secrets/signing.pem}
    decryptionKeys: {source: file, keys: [{kid: REPLACE-ME-decryption-kid, file: /etc/iop-gw/secrets/decryption.pem}]}
  core: {baseUrl: "http://REPLACE-ME-core-service:8090", timeoutSeconds: 30}
  tokenService:
    baseUrl: "https://REPLACE-ME-token-service"
    credentialsFile: /etc/iop-gw/secrets/credentials.json
  apiKey:
    mode: jwt
    issuerKeysUrl: "https://REPLACE-ME-token-service-jwks"
  jws: {algorithm: RS256}
  cr: {source: api, baseUrl: "https://REPLACE-ME-central-registry"}
  aigSource: api
  aigBaseUrl: "https://REPLACE-ME-aig"
  gwApi:
    listenAddr: "0.0.0.0:8443"
    httpListenAddr: null         # no plain-HTTP internal listener
    tls: {certFile: /etc/iop-gw/secrets/gw-tls.crt, keyFile: /etc/iop-gw/secrets/gw-tls.key}
    token: "${IOPGW_API_TOKEN}"
  linkedAAs: {source: config, aas: [REPLACE-ME-linked-aa-id]}
  forwarding: {timeoutSeconds: 30}

# Expose the public /iop listener to other entities' gateways, for example:
# ingress:
#   enabled: true
#   className: nginx
#   host: iop.REPLACE-ME.example
#   tls: [{secretName: iop-tls, hosts: [iop.REPLACE-ME.example]}]
