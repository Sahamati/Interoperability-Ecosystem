openapi: 3.0.3
info:
  title: Sahamati Interoperability APIs - AIG, Interop, IopToken
  version: "1.2"
  description: |
    Generated from "Sahamati Interoperability APIs Specifications" v1.2 (17-Nov-2026, Jithesh Kumar).
    Document Classification: Restricted.

    AIG stands for AA-Interoperability-Graph. The graph provides information on the
    connectivity links that exist between entities in the AA ecosystem. The links may be
    between an FIP and AA, an FIU and AA, or an AA and another AA supporting interoperability.
    Entities use this to identify routes to target entities.

    | Entity | Purpose |
    |---|---|
    | AA  | Identify connected-AAs towards an FIU, and inter-AAs towards an FIP. |
    | FIU | Identify connected-AAs towards a customer-AA. In the long run all AAs will be interconnected; FIUs will not need this graph. |
    | FIP | Identify inter-AAs towards an origin-AA. In the long run all AAs will be interconnected; FIPs will not need this graph. |

    ### Using the IOP token
    **AAs sending:** Direct API -> header `aa_api_key` with the regular token.
    IOP API -> headers `x-conn_aa_api_key`, `x-cust_aa_api_key`, `x-orig_aa_api_key`,
    `x-inter_aa_api_key` with the IOP token.

    **FIUs, FIPs and AAs receiving:** Direct API (`aa_api_key`) -> verify the regular token.
    IOP API (the `x-*_aa_api_key` headers) -> verify the IOP token, with claim `token_use` = `iop`.

    All sample values in this file are synthetic.
servers:
  - url: https://cr.sahamati.org.in
    description: CR-Production
  - url: https://uatcr.sahamati.org.in
    description: CR-UAT
  - url: https://api.sahamati.org.in/iam/v1
    description: TokenService-Production
  - url: https://api.uat.sahamati.org.in/iam/v1
    description: TokenService-UAT
tags:
  - name: AIG Read
  - name: AIG Write
  - name: Interop
  - name: Encryption Keys
  - name: IopToken

paths:
  /v1/aig/fip:
    get:
      tags: [AIG Read]
      summary: Lookup AIG for all FIPs
      description: Returns the inter-AAs linked to each FIP.
      operationId: lookupAigFip
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AigFipResponse"
              example:
                ver: "1.0.0"
                timestamp: "2026-10-07T07:35:00.000Z"
                txnid: "1a4adbbe-29ae-11e8-a8d7-0289437bf331"
                fip:
                  - id: fip-1
                    inter-AA:
                      - id: aa-1
                        verified: true
                        attr: { key1: value1, key2: value2 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/aig/fiu:
    get:
      tags: [AIG Read]
      summary: Lookup AIG for all FIUs
      description: Called only by AAs. Returns the connected-AAs linked to each FIU.
      operationId: lookupAigFiu
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AigFiuResponse"
              example:
                ver: "1.0.0"
                timestamp: "2026-10-07T07:35:00.000Z"
                txnid: "3a4adbbe-29ae-11e8-a8d7-0289437bf331"
                fiu:
                  - id: fiu-4
                    connected-AA:
                      - id: aa-4
                        verified: true
                        attr: { key1: value1, key2: value2 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/aig/aa:
    get:
      tags: [AIG Read]
      summary: Lookup AIG for all AAs
      description: Called with the bearer token of an FIU or FIP. Returns the peer-AAs linked to each AA.
      operationId: lookupAigAa
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AigAaResponse"
              example:
                ver: "1.0.0"
                timestamp: "2026-10-07T07:35:00.000Z"
                txnid: "1a4adbbe-29ae-11e8-a8d7-0289437bf331"
                aa:
                  - id: aa-1
                    peer-AA:
                      - id: aa-2
                        verified: true
                        attr: { key1: value1, key2: value2 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/aig/{aa-entity-id}:
    put:
      tags: [AIG Write]
      summary: Publish AIG graph by AA
      description: Bearer token of a user associated with the calling AA.
      operationId: publishAig
      security:
        - bearerUserAuth: []
      parameters:
        - name: aa-entity-id
          in: path
          required: true
          description: Entity ID of the calling AA.
          schema: { type: string }
          example: aa-entity-00
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AigPublishRequest"
            example:
              ver: "1.0.0"
              timestamp: "2026-11-03T10:00:00.000Z"
              txnid: "1a4adbbe-29ae-11e8-a8d7-0289437bf331"
              fip: [fip-entity-01]
              fiu: [fiu-entity-02]
              aa: [aa-entity-03]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateResponse"
              example:
                ver: "1.0.0"
                timestamp: "2026-11-06T06:22:34.258596480Z"
                txnid: "1a4adbbe-29ae-11e8-a8d7-0289437bf331"
                message: Updated successfully
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/interop/{entity-id}:
    put:
      tags: [Interop]
      summary: Publish Interop-readiness
      description: Bearer token of a user associated with the calling entity.
      operationId: publishInteropReadiness
      security:
        - bearerUserAuth: []
      parameters:
        - name: entity-id
          in: path
          required: true
          description: Entity ID of the calling entity.
          schema: { type: string }
          example: fip-test-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteropReadinessRequest"
            example:
              ver: "1.0.0"
              timestamp: "2026-11-11T08:00:00Z"
              txnid: "0b1c7c1e-0000-4000-8000-000000000005"
              enabled: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateResponse"
              example:
                ver: "1.0.0"
                timestamp: "2026-11-06T06:22:34.258596480Z"
                txnid: "0b1c7c1e-0000-4000-8000-000000000005"
                message: Updated successfully
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v2/enc/entity/certs:
    servers:
      - url: https://{token-service-host-url}
        description: Token service host
        variables:
          token-service-host-url:
            default: token-service-host-url
    post:
      tags: [Encryption Keys]
      summary: Register entity encryption public keys
      description: Bearer token of a user associated with the calling entity.
      operationId: registerEncryptionKey
      security:
        - bearerUserAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncKeyRegisterRequest"
            example:
              entityId: fip-test-001
              validFrom: "2026-12-01T00:00:00Z"
              validTo: "2027-12-01T00:00:00Z"
              key:
                kid: k-enc-1
                kty: RSA
                use: enc
                alg: RSA-OAEP-256
                n: "..."
                e: AQAB
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncKeyRegisterResponse"
              example:
                ver: "2.0.0"
                timestamp: "2026-11-16T08:00:00Z"
                txnId: "<txn-id>"
                message: Encryption certificate registered successfully
                kid: k-enc-1
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v2/enc/entity/certs/{kid}:
    servers:
      - url: https://{token-service-host-url}
        description: Token service host
        variables:
          token-service-host-url:
            default: token-service-host-url
    delete:
      tags: [Encryption Keys]
      summary: Delete a specific public key
      description: Bearer token of a user associated with the calling entity. No request body.
      operationId: deleteEncryptionKey
      security:
        - bearerUserAuth: []
      parameters:
        - name: kid
          in: path
          required: true
          description: Key ID of the public key to delete.
          schema: { type: string }
          example: k-enc-1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncKeyDeleteResponse"
              example:
                ver: "2.0.0"
                timestamp: "2026-11-16T08:00:00Z"
                txnId: "<txn-id>"
                message: Encryption certificate deleted successfully
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/entity/token/generate:
    servers:
      - url: https://{token-service-host-url}
        description: Token service host
        variables:
          token-service-host-url:
            default: token-service-host-url
    post:
      tags: [IopToken]
      summary: Generate an Iop Token
      description: |
        To be used by AAs only.

        The IOP token's claims contain an extra parameter, `token_use: "iop"`. Example claims:
        ```json
        {
          "iss": "https://<auth-host>/auth/realms/sahamati",
          "azp": "aa-test-001",
          "clientId": "aa-test-001",
          "roles": "AA",
          "token_use": "iop",
          "exp": 1794907253
        }
        ```
      operationId: generateIopToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/IopTokenRequest"
            example:
              id: aa-test-001
              secret: "<secret>"
              use: iop
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IopTokenResponse"
              example:
                ver: "1.0.0"
                timestamp: "2026-11-17T15:30:04.532395832Z"
                txnId: "03c6a3ce-c41f-414b-9185-fc9a417182f4"
                accessToken: "eyJhbGciOiJSU...5WFu7TKKyvbVWQ_lQ"
                expiresIn: 86400
                refreshExpiresIn: 0
                tokenType: Bearer
                notBeforePolicy: 0
                scope: email profile
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token of the calling entity (AA, FIU or FIP)
    bearerUserAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token of the user associated with the calling entity for the write APIs.
  schemas:
    RouteLink:
      type: object
      required: [id, verified]
      properties:
        id:
          type: string
          description: Entity ID of the linked AA.
        verified:
          type: boolean
          description: |
            true - flow through this interface has been verified (through SLA data).
            false - interface is published, but traffic flow is yet to be verified.
        attr:
          type: object
          description: For future use; parameters indicating the health of the route.
          additionalProperties: { type: string }

    Envelope:
      type: object
      required: [ver, timestamp, txnid]
      properties:
        ver: { type: string, example: "1.0.0" }
        timestamp: { type: string, format: date-time }
        txnid: { type: string }

    AigFipResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            fip:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  inter-AA:
                    type: array
                    items: { $ref: "#/components/schemas/RouteLink" }

    AigFiuResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            fiu:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  connected-AA:
                    type: array
                    items: { $ref: "#/components/schemas/RouteLink" }

    AigAaResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            aa:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  peer-AA:
                    type: array
                    items: { $ref: "#/components/schemas/RouteLink" }

    AigPublishRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            fip:
              type: array
              description: FIP entity IDs this AA is linked to.
              items: { type: string }
            fiu:
              type: array
              description: FIU entity IDs this AA is linked to.
              items: { type: string }
            aa:
              type: array
              description: AA entity IDs this AA is linked to.
              items: { type: string }

    InteropReadinessRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }

    UpdateResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            message: { type: string }

    Jwk:
      type: object
      required: [kid, kty, use, alg, n, e]
      properties:
        kid: { type: string, description: Key ID }
        kty: { type: string, example: RSA }
        use: { type: string, example: enc }
        alg: { type: string, example: RSA-OAEP-256 }
        n: { type: string, description: RSA modulus (base64url) }
        e: { type: string, description: RSA public exponent (base64url), example: AQAB }

    EncKeyRegisterRequest:
      type: object
      required: [entityId, validFrom, validTo, key]
      properties:
        entityId: { type: string }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        key: { $ref: "#/components/schemas/Jwk" }

    EncKeyDeleteResponse:
      type: object
      properties:
        ver: { type: string, example: "2.0.0" }
        timestamp: { type: string, format: date-time }
        txnId: { type: string }
        message: { type: string }

    EncKeyRegisterResponse:
      allOf:
        - $ref: "#/components/schemas/EncKeyDeleteResponse"
        - type: object
          properties:
            kid: { type: string }

    IopTokenRequest:
      type: object
      required: [id, secret]
      properties:
        id: { type: string, description: AA entity ID }
        secret: { type: string, description: AA client secret }
        use:
          type: string
          enum: [iop]
          description: Optional. Set to `iop` to obtain an IOP token (its claims will include `token_use` = `iop`).

    IopTokenResponse:
      type: object
      properties:
        ver: { type: string }
        timestamp: { type: string, format: date-time }
        txnId: { type: string }
        accessToken: { type: string }
        expiresIn: { type: integer, description: Seconds }
        refreshExpiresIn: { type: integer }
        tokenType: { type: string, example: Bearer }
        notBeforePolicy: { type: integer }
        scope: { type: string }

  responses:
    BadRequest: { description: Bad Request }
    Unauthorized: { description: Unauthorized }
    Forbidden: { description: Forbidden }
    TooManyRequests: { description: Too Many Requests }
    InternalServerError: { description: Internal Server Error }
    NotImplemented: { description: Not Implemented }
    ServiceUnavailable: { description: Service Unavailable }
