# Copy to config.properties and edit. Paths are relative to the working directory.
payloadFile=testdata/payload.json
jweFile=testdata/iopPayload.jwe

# Sender (encrypt): own signing private key (PEM) and its kid as registered in the CR.
# Signs the inner JWS (RFC 7515, RS256). IOP_SIGNING_KEY_FILE overrides the key path.
sender.signingKeyFile=keys/sig/private-key.pem
sender.kid=7ec33a02-84aa-46a2-aff5-3013226461d2

# Sender (decrypt): the sender's public signing JWK as published in the CR, to verify the inner JWS
sender.jwkFile=keys/sig/public-key.jwk.json

# Recipient's public JWK as published in the CR (its kid goes into the JWE header)
recipient.jwkFile=keys/enc/public-key.jwk.json

# Own private key (PEM) for decryption. IOP_PRIVATE_KEY_FILE overrides this.
self.privateKeyFile=keys/enc/private-key.pem
