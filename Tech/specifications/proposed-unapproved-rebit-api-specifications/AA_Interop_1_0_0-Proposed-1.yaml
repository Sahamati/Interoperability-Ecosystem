  title: Account Aggregator Interoperability API
  x-custom-tags:
    x-api-name: Account Aggregator (AA) Interoperability API
tags:
- name: User Discovery
  description: APIs for Customer Discovery
- name: Account Discovery
  description: API for Account Discovery
- name: Account Linking
  description: APIs for Account Linking
- name: Consent Flow
  description: APIs for Consent Management
- name: Data Flow
  description: These APIs are used by AA to facilitate flow of encrypted financial information from FIP to FIU
- name: Notifications
  description: APIs to submit notifications to AA from FIP/FIU.
- name: Monitoring
  description: APIs to check availability of AA application.
schemes:
- https
consumes:
- application/json
produces:
- application/json
security:
- client_api_key: []
- fip_api_key: []
- aa_api_key: []
- x-conn_aa_api_key: []
- x-inter_aa_api_key: []
- x-cust_aa_api_key: []
- x-orig_aa_api_key: []
paths:
