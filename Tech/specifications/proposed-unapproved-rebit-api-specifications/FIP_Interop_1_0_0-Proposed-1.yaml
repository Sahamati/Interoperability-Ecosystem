
swagger: "2.0"
info:
  description: |-
    # Summary

    # Proposed by Sahamati, subject to approval by ReBIT.

       The Financial Information Provider (FIP) Interoperability APIs enable communication between unconnected FIPs and AAs. These APIs facilitate the flow of information between unconnected entities, with their mutually linked AAs acting as gateways. Eventually, customers would be able to use any FIU of their choice to fetch their financial information from any FIP of their choice. Subject to approval by ReBIT.

    ---
  version: 1.0.0
  title: Financial Information Provider Interoperability API
  x-custom-tags:
    x-api-name: Financial Information Provider (FIP) Interoperability API
tags:
- name: Account Discovery
  description: API for Account Discovery
- name: Account Linking
  description: APIs for Account Linking
- name: Consent Flow
  description: APIs for Consent Management
- name: Data Flow
  description: These APIs are used by AA to facilitate flow of encrypted financial information from FIP to FIU
- name: Notifications
  description: APIs to submit notifications to AA from FIP.
- name: Monitoring
  description: APIs to check availability of AA application.
schemes:
- https
consumes:
- application/json
produces:
- application/json
security:
- x-inter_aa_api_key: []
paths:
  /iop/Accounts/discover:
