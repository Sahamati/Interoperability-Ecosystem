      ConsentUse:
        type: object
        description: Section defining the parameters for consent tracking
        required:
          - logUri
          - count
          - lastUseDateTime
        properties:
          logUri:
            type: string
            description: Logging; logUri can be any valid URI including an email address
            xml:
              attribute: true
          count:
            type: number
            description: Number of times the consent has been used
            example: 1
            xml:
              attribute: true
          lastUseDateTime:
            type: string
            format: date-time
            description: Datetime when Consent was last used.
            example: '2018-12-06T11:39:57.153Z'
            xml:
              attribute: true                                            
  FipFIRequest:
    type: object
    required:
      - Consent
      - FIDataRange
    properties:
      Consent:
        type: object
        description: Consent Artefact details.
        required:
          - id
          - digitalSignature
        properties:
          id:
            type: string
            description: Unique ID generated by AA after consent approval is given by the customer.
            example: 654024c8-29c8-11e8-8868-0289437bf331
            xml:
              attribute: true
          digitalSignature:
            type: string
            description: >-
              Signature part of the Consent JWS. The receiver has to check if
              the given signature matches with the signature in the original
              consent JWS.
            example: >-
              NdjwMjLortTb10dxcJezkvdOxPVvEdZvIqwqVWOHnE8pS_YDswcRPLTRmds2xO-Tvm_A2cFv1qKYpaZnv8Bl6xmZoOsG_F8_40gRZqIhz5hF9puzp8lEEhMlZ6NaX2Y2OYkwHcOBBpCIXpLXB4CMWiefUEWjO9zKDd5JJwZ4vLWeT4qgwvPfRqE60B33tzVlF5E6OA2mKK17sGRXsfrI9obEjL52RMdGo_9bv1HnHfvPlbj5ihj6d_5iTtoh7HUC_X8CrJGvkgkCjP_7of1jPb5QgJ9nx_Yfsxj3vf8zEseZIVISjF3MwBzW7Di4CpfQl4wlnpkQO9MKu78F69Z9Ig
      FIDataRange:
        type: object
        required:
          - from
          - to
        description: Specifies the date time range for which the financial information is requested
        properties:
          from:
            type: string
            format: date-time
            example: '2018-11-27T06:26:29.761Z'
            description: Date-time from which the financial information is requested
            xml:
              attribute: true
          to:
            type: string
            format: date-time
            example: '2018-12-27T06:26:29.761Z'
            description: Date-time till which the financial information is requested
            xml:
              attribute: true
  FipFIResponse:
    type: object
    required:
      - consentId
      - sessionId
    description: >-
      Session id and other details to fetch the financial information.
    properties:
      consentId:
        type: string
        description: Unique ID generated by AA after consent approval is given by the customer.
        example: 654024c8-29c8-11e8-8868-0289437bf331
        xml:
          attribute: true
      sessionId:
        type: string
        description: A session ID is a base-64 encoded UUID number that FIP returns to the AA for each financial information access request.
        example: caa2f259-2dc2-4075-87aa-6d81018b6183
        xml:
          attribute: true		 
  FIFetchRequestEncryptedData:
    type: object
    required:
      - sessionId
      - fipId
      - linkRefNumber
    description: Encrypted FI response data
    properties:
      sessionId:
        type: string
        description: >-
          A session ID is a base-64 encoded UUID number that an AA returns to the
          FIU or AA Client for each financial information access request.
        example: caa2f259-2dc2-4075-87aa-6d81018b6183
        xml:
          attribute: true
      fipId:
        type: string
        description: >-
          FIP ID as defined in the Account Aggregator Ecosystem.
        example: FIP-1
        xml:
          attribute: true
      linkRefNumber:
        type: array
        description: >-
          Reference number assigned by FIP as part of Account Linking Process.
        minItems: 1
        uniqueItems: true
        items:
          type: object
          required:
            - id
          properties:
            id:
              type: string
              example: XXXX-XXXX-XXXX
              xml:
                attribute: true	  
  FIFetchResponseEncryptedData:
    description: >-
      A response of encrypted financial information sent to the requesting AA
      for passing to a customer or a FIU
    required:
      - FI
    type: object
    properties:
      FI:
        type: array
        description: >-
          Contains the account-specific metadata with corresponding encrypted
          data for accessing the financial information
        items:
          type: object
          required:
            - fipID
            - data
          properties:
            fipID:
              type: string
              description: FIP ID as defined in the Account Aggregator Ecosystem.
              example: FIP-1
            data:
              type: array
              items:
                type: object
                required:
                  - linkRefNumber
                  - maskedAccNumber
                  - encryptedFI
                properties:
                  linkRefNumber:
                    type: string
                    description: Reference number assigned by FIP as part of Account Linking Process.
                    example: XXXX-XXXX-XXXX
                  maskedAccNumber:
                    type: string
                    description: Masked account number
                    example: XXXXXXXX4020
  FIPConsentStatusNotification:
      description: ''
      type: object
      required:
        - Notifier
        - ConsentStatusNotification
      properties:
        Notifier:
          type: object
          description: Information about the notifier entity.
          required:
            - type
            - id
          properties:
            type:
              type: string
              description: Type of the notifier entity
              example: AA
              xml:
                attribute: true
            id:
              type: string
              description: Unique ID to identify the entity
              example: AA_1
              xml:
                attribute: true
        ConsentStatusNotification:
          type: object
          description: Contains the Consent ID and Consent Status details.
          required:
            - consentId
            - consentStatus
          properties:
            consentId:
              type: string
              description: >-
                Unique ID generated by AA after consent approval is given by the customer.
              example: XXXX0-XXXX-XXXX
              xml:
                attribute: true
            consentStatus:
              type: string
              description: Specifies the status of consent artefact
              enum:
                - REVOKED
                - PAUSED
                - ACTIVE
                - EXPIRED
              example: REVOKED
              xml:
                attribute: true
  IOPBaseRequest:
    type: object
    required:
    - correlationId
    - timestamp
    - txnid
    - ver
    properties:
      ver:
        type: string
        example: 1.0.0
        xml:
          attribute: true
        description: API version.
      timestamp:
        type: string
        format: date-time
        example: 2026-08-18T09:30:00Z
        xml:
          attribute: true
        description: Request creation timestamp.
      txnid:
        type: string
        example: 4a4adbbe-29ae-11e8-a8d7-0289437bf331
        xml:
          attribute: true
        description: Unique transaction identifier used for providing an end to end traceability.
      correlationId:
        $ref: "#/definitions/CorrelationId"
  FITypes:
    type: array
    minItems: 1
    items:
      type: string
      description: List of financial information types.
      example: DEPOSIT
      enum:
        - DEPOSIT
        - TERM_DEPOSIT
        - RECURRING_DEPOSIT
        - SIP
        - CP
        - GOVT_SECURITIES
        - EQUITIES
        - BONDS
        - DEBENTURES
        - MUTUAL_FUNDS
        - ETF
        - IDR
        - CIS
        - AIF
        - INSURANCE_POLICIES
        - NPS
        - INVIT
        - REIT
        - GSTR1_3B
        - LIFE_INSURANCE
        - GENERAL_INSURANCE
        - OTHER  
  SignedConsentDetail:
        type: object
        description: >-
          This Section defines the consent and should be digitally signed using the Json Web Signature method. CAN
          NOT CHANGE after generation, for any change a new consent has to be
          generated.
        required:
          - consentStart
          - consentExpiry
          - consentMode
          - fetchType
          - consentTypes
          - fiTypes
          - DataConsumer
          - DataProvider
          - Customer
          - Purpose
          - FIDataRange
          - DataLife
          - Frequency
          - Accounts
        properties:
          consentStart:
            type: string
            format: date-time
            example: '2019-12-06T11:39:57.153Z'
            description: >-
              Start date-time of the consent. This field would allow for
              Post-Dated consent.
            xml:
              attribute: true
          consentExpiry:
            type: string
            format: date-time
            example: '2019-12-06T11:39:57.153Z'
            description: Expiry date-time for the consent
            xml:
              attribute: true
          consentMode:
            type: string
            description: Consent Mode as defined in the AA Technical Specification
            enum:
              - VIEW
              - STORE
              - QUERY
              - STREAM
            xml:
              attribute: true
          fetchType:
            type: string
            description: FI Fetch type. Could be ONETIME or PERIODIC
            enum:
              - ONETIME
              - PERIODIC
            xml:
              attribute: true
          consentTypes:
            type: array
            description: Defines the category of financial information which can be fetched using consent
            minItems: 1
            items:
              type: string
              enum:
                - PROFILE
                - SUMMARY
                - TRANSACTIONS
              example: PROFILE
          fiTypes:
            $ref: '#/definitions/FITypes'
          DataConsumer:
            type: object
            required:
              - id
              - type
            description: >-
              The entity which receives data. For a consent
              between FIP & AA, DataConsumer would be AA whereas for a consent
              between FIU/AA Application & AA, DataConsumer would be FIU/AA Client
            properties:
              id:
                type: string
                description: Data Consumer ID
                example: DC1
                xml:
                  attribute: true
              type:
                type: string
                description: Data Consumer Type
                enum:
                  - FIU
                  - USER
                  - AA
                example: FIU
          DataProvider:
            type: object
            required:
              - id
              - type
            description: >-
              The entity which provides data. For a consent
              between FIP & AA, DataProvider would be FIP whereas for a consent
              between FIU/AA Client & AA, DataProvider would be AA.
            properties:
              id:
                type: string
                description: Data Provider ID.
                example: DP1
                xml:
                  attribute: true
              type:
                type: string
                description: Data Provider Type.
                enum:
                  - FIP
                  - AA
                example: FIP
          Customer:
            type: object
            required:
              - id
            properties:
              id:
                type: string
                description: Identifier of the Customer generated during the registration with AA.
                example: customer_identifier@AA_identifier
                xml:
                  attribute: true
          Accounts:
            type: array
            description: >-
              List of accounts which the consent would fetch FI from. For a
              consent between FIU & AA, this list could have accounts from
              multiple FIP. For a consent between FIP & AA, only accounts from
              particular FIP must be present in this section.
            items:
              type: object
              required:
                - fiType
                - fipId
                - accType
                - linkRefNumber
                - maskedAccNumber
              properties:
                fiType:
                  type: string
                  description: Type of Financial Information
                  example: DEPOSIT
                  xml:
                    attribute: true
                fipId:
                  type: string
                  description: FIP ID as defined in the Account Aggregator Ecosystem.
                  example: FIP1
                  xml:
                    attribute: true
                accType:
                  type: string
                  description: The Account Type or Sub FI Type
                  example: SAVINGS
                  xml:
                    attribute: true
                linkRefNumber:
                  type: string
                  description: Reference number assigned by FIP as part of Account Linking Process.
                  example: XXXX-XXXX-XXXX
                  xml:
                    attribute: true
                maskedAccNumber:
                  type: string
                  description: Masked account number
                  example: XXXXXXXX4020
                  xml:
                    attribute: true
            xml:
              name: Accounts
          Purpose:
            $ref: '#/definitions/Purpose'
          FIDataRange:
            description: Specifies the date time range for which the financial information is requested
            type: object
            required:
              - from
              - to
            properties:
              from:
                type: string
                format: date-time
                description: Date-time from which the financial information is requested
                xml:
                  attribute: true
                example: '2017-07-13T11:33:34.509Z'
              to:
                type: string
                format: date-time
                description: Date-time till which the financial information is requested
                xml:
                  attribute: true
                example: '2023-07-06T11:33:34.509Z'
          DataLife:
            description: >-
              Datalife defines for how long the FIU/AA Client store the
              data
            type: object
            required:
              - unit
              - value
            properties:
              unit:
                type: string
                description: A unit of how long consumer can store the data.
                xml:
                  attribute: true
                enum:
                  - DAY
                  - MONTH
                  - YEAR
                  - INF
              value:
                type: number
                description: 'Value for the Datalife Unit. If INF, value must be set to 0.'
                xml:
                  attribute: true
          Frequency:
            description: >-
              Defines frequency of FI data fetch within the defined time unit. E.g.HOURLY,DAILY,MONTHLY,YEARLY.
            type: object
            required:
              - unit
              - value
            properties:
              unit:
                type: string
                example: HOUR
                description: >-
                  Defines the time unit of the frequency to access the financial information.
                enum:
                  - HOUR
                  - DAY
                  - MONTH
                  - YEAR
                xml:
                  attribute: true
              value:
                type: number
                example: 1
                description: >-
                  Define the number of times FI data can be fetched within the defined time unit.
                xml:
                  attribute: true
            xml:
              name: Frequency
          DataFilter:
            type: array
            description: Rules that will be utilized by FIP to filter the data
            items:
              type: object
              required:
                - type
                - operator
                - value
              properties:
                type:
                  type: string
                  description: The condition to filter the data on.
                  enum:
                    - TRANSACTIONTYPE
                    - TRANSACTIONAMOUNT
                  example: TRANSACTIONAMOUNT
                  xml:
                    attribute: true
                operator:
                  type: string
                  description: Operator to filter data by.
                  enum:
                    - '='
                    - '!='
                    - '>'
                    - '<'
                    - '>='
                    - '<='
                  example: '>='
                  xml:
                    attribute: true
                value:
                  type: string
                  description: Value to filter data
                  example: 20000
                  xml:
                    attribute: true
            xml:
              name: DataFilter
  NotificationResponse:
        type: object
        properties:
            response:
              type: string
              example: "OK"
        xml:
            attribute: true
  Purpose:
    description: Purpose of the consent (Defined in AA Technical Specification)
    type: object
    required:
      - code
    properties:
      code:
        type: string
        description: Purpose Code as defined in the AA Technical Specification
        example: '101'
        xml:
          attribute: true
      refUri:
        type: string
        description: URL where the purpose is further defined
        example: 'https://api.rebit.org.in/aa/purpose/101.xml'
        xml:
          attribute: true
      text:
        type: string
        description: Textual Description
        example: Wealth management service
        xml:
          attribute: true
      Category:
        properties:
          type:
            type: string
            description: Category name of the Purpose code
            xml:
              attribute: true          