      tags:
      - Account Discovery
      description: |-
        This API is called by an inter-AA to an FIP.
        Business purpose: This API enables an AA to discover accounts belonging to a customer based on the customer identifiers. A list of masked account information and corresponding linkRefNumber for each discovered account is returned based on the identifier matching logic at FIP.

        <br>Note: "Request Body Example Value" and "Responses Example Value" given below is for illustrative purposes only.
      parameters:
      - name: x-jws-signature
        in: header
        description: Detached JWS of the body
        required: true
        type: string
      - in: body
        name: body
        description: Information of the user for discovering the account/s at the FIP
        required: false
        schema:
          $ref: "#/definitions/IOPAccountDiscoverRequest"
      security:
      - x-inter_aa_api_key: []
      responses:
