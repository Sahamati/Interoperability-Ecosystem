  LinkReverifyRequest:
    description: >-
      Information of the user handle and link reference number to be verified
    type: object
    required:
      - ver
      - timestamp
      - txnid
      - token
      - customerAddress
      - linkRefNumber
    properties:
      ver:
        type: string
        example: '2.0.0'
        description: API version
        xml:
          attribute: true
      timestamp:
        type: string
        description: Creation timestamp of the message.
        format: date-time
        example: '2023-06-26T10:27:17.699+0000'
        xml:
          attribute: true
      txnid:
        type: string
        description: >-
          Unique transaction identifier used for providing an end to end
          traceability.
        example: 410c2d2e-4a1e-11e8-960e-0277a9fbfedc
        xml:
          attribute: true
      customerAddress:
        type: string
        description: Identifier of the Customer generated during the registration with AA.
        example: customer_address@aa_identifier
        xml:
          attribute: true
      linkRefNumber:
        type: string
        description: Reference number assigned by FIP as part of Account Linking Process.
        example: xxxxxxxxxxxxx
        xml:
          attribute: true
  LinkReverifyResponse:
    description: >-
      A response of confirmation for account reverify with a link reference number
      and user handle for vua attestation
    type: object
    required:
      - ver
      - timestamp
      - txnid
      - status
      - AccLinkReverifyDetails
    properties:
      ver:
        type: string
        example: '2.0.0'
        description: API version
        xml:
          attribute: true
