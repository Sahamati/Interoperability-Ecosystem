              "iv": "BASE64URL(96BIT_NONCE)",
              "ciphertext": "BASE64URL(ENCRYPTED_SIGNED_JWS)",
              "tag": "BASE64URL(128BIT_AUTH_TAG)"
            }
      ```
      Only the Compact Serialization string is sent on the wire; the JSON form above is explanatory.
      The ciphertext contains the actual payload that needs to be encrypted.
    pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
    example: eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIiwia2lkIjoic2VydmVyLWtleS0wMSJ9.ENCRYPTED_CEK.NONCE_96BIT.CIPHERTEXT.AUTH_TAG_128BIT
  IOPConsentNotificationRequest:
    type: object
    required:
    - timestamp
    - txnid
    - ver
    - correlationId
    - encryptedPayload
    - Initiator
    properties:
      ver:
        type: string
        example: 1.0.0
        xml:
          attribute: true
        description: API version.
      timestamp:
        type: string
        format: date-time
        example: 2026-10-07T07:35:00Z
        xml:
          attribute: true
        description: Request creation timestamp.
      txnid:
        type: string
        example: 4a4adbbe-29ae-11e8-a8d7-0289437bf331
        xml:
          attribute: true
      correlationId:
        $ref: "#/definitions/CorrelationId"
      Initiator:
        $ref: "#/definitions/Initiator"  
      encryptedPayload:
        $ref: "#/definitions/IopConsentNotificationPayload"
  IOPFINotificationRequest:
    type: object
    required:
    - timestamp
    - txnid
    - ver
    - correlationId
    - encryptedPayload
    - Initiator
    properties:
      ver:
        type: string
        example: 1.0.0
        xml:
          attribute: true
        description: API version.
      timestamp:
        type: string
        format: date-time
        example: 2026-10-07T07:35:00Z
        xml:
          attribute: true
        description: Request creation timestamp.
      txnid:
        type: string
        example: 4a4adbbe-29ae-11e8-a8d7-0289437bf331
        xml:
          attribute: true
      correlationId:
        $ref: "#/definitions/CorrelationId"
      Initiator:
        $ref: "#/definitions/Initiator"  
      encryptedPayload:
        $ref: "#/definitions/IopFINotificationPayload"
  IOPConsentNotificationResponse:
    type: object
    required:
    - encryptedPayload
    - timestamp
    - txnid
    - ver
    - correlationId
    properties:
      ver:
        type: string
        example: 1.0.0
        xml:
          attribute: true
        description: API version.
      timestamp:
        type: string
        format: date-time
        example: 2026-10-07T07:35:00Z
        xml:
          attribute: true
        description: Request creation timestamp.
      txnid:
        type: string
        example: 4a4adbbe-29ae-11e8-a8d7-0289437bf331
