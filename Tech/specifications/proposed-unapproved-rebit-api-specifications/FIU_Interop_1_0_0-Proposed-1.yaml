        type: string
        example: 1.0.0
        xml:
          attribute: true
        description: API version.
      timestamp:
        type: string
        format: date-time
        example: 2026-10-07T07:35:00Z
        xml:
          attribute: true
        description: Request creation timestamp.
      txnid:
        type: string
        example: 4a4adbbe-29ae-11e8-a8d7-0289437bf331
        xml:
          attribute: true
      correlationId:
        $ref: "#/definitions/CorrelationId"
      encryptedPayload:
        $ref: "#/definitions/IopNotificationResponsePayload"
  ErrorResponse:
    type: object
    required:
    - timestamp
    - correlationId
    - txnid
    - ver
    properties:
      ver:
        type: string
        example: 2.0.0
        xml:
          attribute: true
        description: API version.
      txnid:
        type: string
        example: 0b811819-9044-4856-b0ee-8c88035f8858
        xml:
          attribute: true
        description: Transaction id of the request. Must be same as the value sent in the request
      timestamp:
        type: string
        format: date-time
        example: 2023-06-26T11:33:34.509Z
        xml:
          attribute: true
        description: Response timestamp
      correlationId:
        $ref: "#/definitions/CorrelationId"
      errorCode:
        type: string
        xml:
          attribute: true
        description: Error code indicating the problem with the request.
      errorMsg:
        type: string
        example: Error code specific error message
        description: Error message with additional details. Ensure no sensitive information is included in the error message.
      errorSource:
        $ref: "#/definitions/SourceOfError"
    description: Generic Error Response. Specific Error Responses extend from this.
  IOPErrorResponse:
    type: object
    required:
    - encryptedPayload
    properties:
      encryptedPayload:
        $ref: "#/definitions/EncryptedPayload"
    description: Generic Error Response. Specific Error Responses extend from this.
  IOPBadRequest:
    properties:
      errorCode:
        type: string
        xml:
          attribute: true
        description: Error code pertaining to the invalid request.
        enum:
        - InvalidRequest
        - InvalidURI
        - InvalidSecurity
        - SignatureDoesNotMatch
    allOf:
    - $ref: "#/definitions/ErrorResponse"
    - $ref: "#/definitions/IOPErrorResponse"
    - {}
    description: Response to bad request.
  IOPNotFound:
    properties:
      errorCode:
        type: string
        xml:
          attribute: true
        description: Indicates that the resource specified in the request was not found.
        enum:
        - NoSuchResource
    allOf:
    - $ref: "#/definitions/ErrorResponse"
    - $ref: "#/definitions/IOPErrorResponse"
    - {}
    description: Requested resource was not found.
  IOPConflict:
    properties:
      errorCode:
        type: string
        xml:
          attribute: true
        description: IdempotencyError when UUID/Id is not unique.
        enum:
        - IdempotencyError
    allOf:
    - $ref: "#/definitions/ErrorResponse"
    - $ref: "#/definitions/IOPErrorResponse"
    - {}
    description: IdempotencyError when UUID/Id is not unique
  IOPPreconditionFailed:
    properties:
      errorCode:
        type: string
        xml:
          attribute: true
        enum:
        - PreconditionFailed
    allOf:
    - $ref: "#/definitions/ErrorResponse"
    - $ref: "#/definitions/IOPErrorResponse"
    - {}
    description: At least one of the preconditions you specified did not hold.
  IOPInternalServerError:
    properties:
      errorCode:
        type: string
        xml:
          attribute: true
        enum:
        - InternalError
    allOf:
    - $ref: "#/definitions/ErrorResponse"
    - $ref: "#/definitions/IOPErrorResponse"
    - {}
    description: Encountered an internal error. Please try again.
  IOPNotImplemented:
    properties:
      errorCode:
        type: string
        xml:
          attribute: true
        enum:
        - NotImplemented
    allOf:
    - $ref: "#/definitions/ErrorResponse"
    - $ref: "#/definitions/IOPErrorResponse"
    - {}
    description: Trying to access an unimplemented feature/API. Required when we provide backward compatiable API.
  IOPServiceUnavailable:
    properties:
      errorCode:
        type: string
        xml:
          attribute: true
        enum:
        - ServiceUnavailable
    allOf:
    - $ref: "#/definitions/ErrorResponse"
    - $ref: "#/definitions/IOPErrorResponse"
    - {}
    description: Service is unavailable.
  IOPBadRequestConsentNotification:
    properties:
      errorCode:
        type: string
        xml:
          attribute: true
        enum:
        - InvalidRequest
        - InvalidURI
        - InvalidSecurity
        - SignatureDoesNotMatch
        - InvalidNotifier
    allOf:
    - $ref: "#/definitions/IOPBadRequest"
    - {}
    description: Bad Request during Consent Notification
  IOPBadRequestFINotification:
    properties:
      errorCode:
        type: string
        xml:
          attribute: true
        enum:
        - InvalidRequest
        - InvalidURI
        - InvalidSecurity
        - SignatureDoesNotMatch
        - InvalidFIStatusNotification
    allOf:
    - $ref: "#/definitions/IOPBadRequest"
    - {}
    description: Bad Request during Consent Notification
  IOPUnauthorizedAccess:
    properties:
      errorCode:
        type: string
        xml:
          attribute: true
        enum:
        - Unauthorized
    allOf:
    - $ref: "#/definitions/ErrorResponse"
    - $ref: "#/definitions/IOPErrorResponse"
    - {}
    description: Unauthorized Access