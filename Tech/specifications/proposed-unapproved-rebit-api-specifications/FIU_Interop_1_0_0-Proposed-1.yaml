              "encrypted_key": "BASE64URL(ENCRYPTED_CEK)",
              "iv": "BASE64URL(96BIT_NONCE)",
              "ciphertext": "BASE64URL(ENCRYPTED_SIGNED_JWS)",
              "tag": "BASE64URL(128BIT_AUTH_TAG)"
            }
      ```
      Only the Compact Serialization string is sent on the wire; the JSON form above is explanatory.
      The ciphertext contains the actual payload that needs to be encrypted.
    pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
    example: eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIiwia2lkIjoic2VydmVyLWtleS0wMSJ9.ENCRYPTED_CEK.NONCE_96BIT.CIPHERTEXT.AUTH_TAG_128BIT
  IopFINotificationPayload:
    type: string
    xml:
      attribute: true
    description: |-
      End-to-end **signed-then-encrypted** business payload, readable only by the target entity. Gateways forward it unchanged.

      The originator first signs the payload (JWS, RFC 7515), then encrypts the signed JWS using the recipient's public encryption key published in the Central Registry (CR). The result is a JWE in **Compact Serialization** (RFC 7516). Hop-AAs (Connected-AA, Inter-AA) forward it unchanged and cannot read it.

      The value consists of five base64url-encoded parts separated by `.`:

      `BASE64URL(JWE_PROTECTED_HEADER).BASE64URL(ENCRYPTED_CEK).BASE64URL(IV).BASE64URL(CIPHERTEXT).BASE64URL(AUTH_TAG)`

      1. **Protected header**: JSON header identifying the algorithms and key, e.g. `{"alg":"RSA-OAEP-256","enc":"A256GCM","kid":"<recipient-key-id>","cty":"JWT"}`
      2. **Encrypted key**: the content encryption key (CEK), encrypted with the recipient's public key.
      3. **Initialisation vector**: 96-bit (12-byte) nonce used for AES-GCM.
      4. **Ciphertext**: the signed JWS, encrypted with the CEK.
      5. **Authentication tag**: 128-bit AES-GCM authentication tag.

      For reference, the same parts in JWE JSON Serialization member names (RFC 7516 §7.2):
      ```json
